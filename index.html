<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Werkstattaufträge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --zink:#E7EBEE; --blech:#FFFFFF; --tinte:#12171C; --stahl:#5C6772;
    --kante:#C9D2D9; --oel:#B4690E; --signal:#D7263D; --gruen:#2F7A4C;
    --radius:3px;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain}
  body{background:var(--zink);color:var(--tinte);font-family:var(--body);font-size:15px;line-height:1.45;
       padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  :focus-visible{outline:2px solid var(--oel);outline-offset:2px}

  .kopf{position:sticky;top:0;z-index:20;background:var(--tinte);color:#fff;
        padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:9px;
        border-bottom:3px solid var(--oel)}
  .kopf h1{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.13em;
           text-transform:uppercase;margin:0;flex:1}
  .knopf{background:transparent;color:#fff;border:1px solid #46525E;border-radius:var(--radius);
         padding:6px 10px;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .knopf-voll{background:var(--oel);border-color:var(--oel)}

  .syncleiste{background:#DCE3E8;border-bottom:1px solid var(--kante);padding:6px 14px;
              font-size:12px;color:var(--stahl);display:flex;gap:8px;align-items:center;font-family:var(--mono)}
  .syncleiste .punkt{width:8px;height:8px;border-radius:50%;background:var(--stahl);flex:none}
  .punkt.an{background:var(--gruen)} .punkt.aus{background:var(--signal)} .punkt.laeuft{background:var(--oel)}
  .syncleiste button{margin-left:auto;background:none;border:0;color:var(--oel);font-family:var(--mono);font-size:12px;padding:2px 4px}

  .reiter-zeile{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--zink);
                border-bottom:1px solid var(--kante);position:sticky;z-index:15;-webkit-overflow-scrolling:touch}
  .reiter-zeile::-webkit-scrollbar{display:none}
  .reiter{background:var(--blech);border:1px solid var(--kante);border-radius:20px;padding:6px 13px;
          font-size:13px;color:var(--stahl);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
  .reiter[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff}
  .reiter .n{font-family:var(--mono);font-size:11px;opacity:.75}

  .suchfeld{margin:10px 14px 0;width:calc(100% - 28px);padding:9px 12px;border:1px solid var(--kante);
            border-radius:var(--radius);background:var(--blech)}

  .liste{padding:12px 14px 96px;display:grid;gap:10px}
  .karte{background:var(--blech);border:1px solid var(--kante);border-left:5px solid var(--stahl);
         border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%;display:block;position:relative}
  .karte .nr{font-family:var(--mono);font-size:11px;color:var(--stahl)}
  .karte .haupt{font-family:var(--display);font-size:19px;font-weight:600;margin:2px 0 1px;padding-right:58px;
                letter-spacing:.02em}
  .karte .neben{font-size:13px;color:var(--stahl)}
  .karte .anliegen{margin-top:8px;padding-top:8px;border-top:1px dashed var(--kante);font-size:13.5px;
                   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .karte .fuss{margin-top:8px;display:flex;justify-content:space-between;font-family:var(--mono);
               font-size:12px;color:var(--stahl)}
  .karte .summe{color:var(--tinte);font-size:14px}
  .kennz{display:inline-block;font-family:var(--mono);font-weight:600;font-size:11px;border:1.5px solid var(--tinte);
         border-left:6px solid #1E4DA8;border-radius:3px;padding:1px 5px 1px 3px;background:#fff}
  .plakette{position:absolute;top:11px;right:12px;width:46px;height:46px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;
            text-transform:uppercase;color:#1a1a1a;border:2px solid rgba(18,23,28,.55);font-weight:600}
  .s-angenommen{background:#F2A03D} .s-arbeit{background:#8FD0F0} .s-teile{background:#F4E04D}
  .s-fertig{background:#7FCB8F} .s-abgeholt{background:#DCD9D2;color:#6A6A6A}
  .k-angenommen{border-left-color:#F2A03D} .k-arbeit{border-left-color:#3FA3D8} .k-teile{border-left-color:#D9BF1E}
  .k-fertig{border-left-color:var(--gruen)} .k-abgeholt{border-left-color:#B9B9B9;opacity:.72}

  .neu{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;
       background:var(--oel);color:#fff;border:0;border-radius:28px;padding:14px 20px;
       font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;font-size:14px;
       box-shadow:0 4px 14px rgba(18,23,28,.3)}

  .leer{text-align:center;color:var(--stahl);padding:50px 24px}
  .leer h2{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:16px;color:var(--tinte)}

  .blatt{position:fixed;inset:0;z-index:40;background:var(--blech);overflow-y:auto;display:flex;flex-direction:column}
  .blatt[hidden]{display:none}
  .blatt-kopf{position:sticky;top:0;background:var(--tinte);color:#fff;z-index:2;
              padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:9px;align-items:center}
  .blatt-kopf .titel{flex:1;font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;font-size:15px}
  .blatt-inhalt{padding:14px;flex:1}
  fieldset{border:0;border-top:1px solid var(--kante);margin:0;padding:13px 0 6px}
  legend{font-family:var(--display);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--oel)}
  label{display:block;font-size:12px;color:var(--stahl);margin-bottom:3px}
  .feld{width:100%;padding:10px;border:1px solid var(--kante);border-radius:var(--radius);
        background:#FBFCFD;margin-bottom:10px}
  textarea.feld{min-height:66px;resize:vertical}
  .zeile{display:grid;gap:10px;grid-template-columns:1fr 1fr}

  .statuswahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:6px;margin-bottom:12px}
  .statuswahl button{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);padding:9px 4px;
                     font-size:12px;color:var(--stahl)}
  .statuswahl button[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff}

  .pos{display:grid;grid-template-columns:1fr 76px 34px;grid-template-areas:'bez bez weg' 'einheit anzahl weg' 'preis summe weg';
       gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--kante)}
  .pos [data-f="bez"]{grid-area:bez}
  .pos [data-f="einheit"]{grid-area:einheit}
  .pos .anzahl{grid-area:anzahl}
  .pos .einzel{grid-area:preis}
  .pos .summe{grid-area:summe;align-self:center;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .pos .weg{grid-area:weg;align-self:start}
  .pos .feld[readonly]{background:#EEF2F5;color:var(--stahl)}
  .pos .feld{margin-bottom:0;padding:9px 7px}
  .pos-kopf{font-size:11px;color:var(--stahl);text-transform:uppercase;margin-bottom:6px}
  .weg{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);color:var(--stahl)}
  .plus{background:#fff;border:1px dashed var(--kante);border-radius:var(--radius);padding:8px 12px;
        color:var(--stahl);font-size:13px}

  .summen{background:#F4F7F9;border:1px solid var(--kante);border-radius:var(--radius);padding:11px 13px;
          margin-top:8px;font-family:var(--mono);font-size:13px}
  .summen div{display:flex;justify-content:space-between;padding:2px 0}
  .summen .brutto{border-top:2px solid var(--tinte);margin-top:6px;padding-top:6px;font-size:16px;
                  font-family:var(--display);font-weight:600}

  .aktionen{position:sticky;bottom:0;background:var(--blech);border-top:1px solid var(--kante);
            padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .k2{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);padding:11px 14px;
      font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;flex:1}
  .k2-haupt{background:var(--tinte);border-color:var(--tinte);color:#fff}
  .k2-loeschen{flex:none;color:var(--stahl)}
  .k2-loeschen:hover{color:var(--signal);border-color:var(--signal)}

  .bilder{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .bildkachel{position:relative;width:88px;height:88px;border:1px solid var(--kante);border-radius:var(--radius);
              overflow:hidden;background:#F1F4F6;display:flex;align-items:center;justify-content:center}
  .bildkachel img{width:100%;height:100%;object-fit:cover;display:block}
  .bildkachel .lade{font-size:10px;color:var(--stahl);text-align:center;padding:4px}
  .bildkachel .weg{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;
                   border:0;background:rgba(18,23,28,.72);color:#fff;font-size:12px;line-height:1;padding:0}
  /* Bild oben angeheftet – Formular scrollt darunter weiter */
  .bildseite{position:sticky;top:0;z-index:3;background:#0D1116;display:flex;flex-direction:column;
             border-bottom:1px solid rgba(255,255,255,.2)}
  .bildseite[hidden]{display:none}
  .bildseite-kopf{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#161C22;color:#fff;font-size:12px}
  .bildseite-kopf .wer{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
  .bildseite-kopf button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.32);
                         border-radius:var(--radius);padding:5px 9px;font-size:12px}
  .bildseite-flaeche{overflow:auto;height:38vh;display:flex;align-items:center;justify-content:center;padding:6px}
  .bildseite-flaeche img{transform-origin:center center;max-width:100%;max-height:100%;object-fit:contain}
  .bildseite-flaeche.frei{align-items:flex-start;justify-content:flex-start}
  .bildseite-flaeche.frei img{max-width:none;max-height:none}
  .bildseite.gross .bildseite-flaeche{height:66vh}

  .scheinbox{position:fixed;inset:0;z-index:75;background:rgba(10,13,16,.6);display:flex;
             align-items:center;justify-content:center;padding:14px}
  .scheinbox[hidden]{display:none}
  .scheinblatt{background:var(--blech);border-radius:var(--radius);max-width:520px;width:100%;
               max-height:92vh;overflow-y:auto;padding:16px;border:1px solid var(--kante)}
  .scheinblatt h3{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;
                  font-size:14px;margin:0 0 4px}
  .scheinzeile{display:flex;gap:9px;align-items:center;margin-bottom:8px}
  .scheinzeile input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--kante);
                                border-radius:var(--radius);background:#FBFCFD}
  .scheinzeile .bez{width:104px;font-size:12px;color:var(--stahl);flex:none}
  .fortschritt{height:6px;background:#E3E9ED;border-radius:3px;overflow:hidden;margin:10px 0}
  .fortschritt div{height:100%;background:var(--oel);width:0%}

  /* ---------- Freisprechmodus ---------- */
  .diktat{position:fixed;inset:0;z-index:90;background:#0D1116;color:#F2F5F7;
          display:flex;flex-direction:column;padding:14px}
  .diktat[hidden]{display:none}
  .diktat-kopf{display:flex;align-items:center;gap:10px;flex:none}
  .diktat-punkt{width:14px;height:14px;border-radius:50%;background:#5A666F;flex:none}
  .diktat.hoert .diktat-punkt{background:#D64525;animation:pulsen 1.2s ease-in-out infinite}
  @keyframes pulsen{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
  .diktat-ziel{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;flex:1}
  .diktat-text{flex:1;overflow-y:auto;margin:12px 0;font-size:17px;line-height:1.5;white-space:pre-wrap}
  .diktat-text .vorlaeufig{opacity:.5}
  .diktat-hinweis{font-size:12px;color:#9AA6AE;flex:none;line-height:1.5}
  .diktat-tasten{display:flex;gap:8px;flex:none;margin-top:10px}
  .diktat-tasten button{flex:1;padding:14px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.3);
                        background:rgba(255,255,255,.12);color:#fff;font-size:15px}
  .diktat-tasten button.haupt{background:#D64525;border-color:#D64525}
  .diktat-gross{margin:auto;text-align:center}
  .diktat-gross button{padding:26px 34px;font-size:19px;border-radius:var(--radius);
                       background:#D64525;color:#fff;border:0}
  .meldung{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
           z-index:60;background:var(--tinte);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;
           max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .meldung[hidden]{display:none}
  .meldung.fehler{background:var(--signal)}
  .notiz{font-size:12.5px;color:var(--stahl);margin:0 0 10px}
  code{font-family:var(--mono);font-size:12px;background:#F1F4F6;padding:1px 4px;border-radius:2px;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="kopf">
  <h1>Aufträge</h1>
  <button class="knopf" id="btnSync">Sync</button>
  <button class="knopf" id="btnSetup">Konto</button>
</header>

<div class="syncleiste"><span class="punkt" id="punkt"></span><span id="syncText">Nicht verbunden</span>
  <button id="btnJetzt">Aktualisieren</button></div>

<div class="reiter-zeile" id="reiter"></div>
<input class="suchfeld" id="suche" type="search" placeholder="Kunde, Kennzeichen, Modell …">
<main class="liste" id="liste"></main>
<button class="neu" id="btnNeu">+ Auftrag</button>

<section class="blatt" id="blatt" hidden>
  <div class="blatt-kopf"><span class="titel" id="blattTitel">Auftrag</span>
    <button class="knopf" id="btnZurueck">Zurück</button></div>
  <div class="bildseite" id="bildseite" hidden>
    <div class="bildseite-kopf">
      <span class="wer" id="bildseiteName">Bild</span>
      <button id="bildKleiner">−</button>
      <button id="bildGroesser">+</button>
      <button id="bildDrehen">Drehen</button>
      <button id="bildHoehe">Größer</button>
      <button id="bildseiteZu">Zu</button>
    </div>
    <div class="bildseite-flaeche" id="bildseiteFlaeche"><img id="bildseiteImg" alt="Auftragsbild"></div>
  </div>
  <div class="blatt-inhalt" id="blattInhalt"></div>
</section>

<div class="scheinbox" id="scheinbox" hidden><div class="scheinblatt" id="scheinblatt"></div></div>
<div class="diktat" id="diktat" hidden>
  <div class="diktat-kopf">
    <span class="diktat-punkt"></span>
    <span class="diktat-ziel" id="diktatZiel">Auftragsumfang</span>
    <span class="diktat-hinweis" id="diktatStand"></span>
  </div>
  <div class="diktat-text" id="diktatText"></div>
  <p class="diktat-hinweis">Sprich einfach los. Gesprochene Befehle:
    <b>Auftragsumfang</b> · <b>Notiz</b> · <b>neuer Auftrag</b> · <b>speichern</b> · <b>Ende</b></p>
  <div class="diktat-tasten">
    <button class="haupt" id="diktatFertig">Übernehmen</button>
    <button id="diktatAus">Ende</button>
  </div>
</div>
<div class="meldung" id="meldung" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const STATUS = [
  {id:'angenommen', label:'Angenommen', kurz:'Ang'},
  {id:'arbeit',     label:'In Arbeit',  kurz:'Arb'},
  {id:'teile',      label:'Auf Teile',  kurz:'Teile'},
  {id:'fertig',     label:'Fertig',     kurz:'Fertig'},
  {id:'abgeholt',   label:'Abgeholt',   kurz:'Abg'}
];
const VORGABE = {aw:9.60, stundensatz:96, kleinunternehmer:false, mwst:19, betrieb:'UCL Motorrad\nBergheimer Straße 26\n88677 Markdorf'};
const SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events';
const ZEITZONE = 'Europe/Berlin';

let cfg = {clientId:'', dateiName:'werkstattauftraege-daten.json', kalender:true, konto:''};
let daten = {version:1, settings:Object.assign({},VORGABE), auftraege:[]};
let dateiId = null, standDrive = null, token = null, tokenBis = 0, tokenClient = null;
let filter = 'offen', suchtext = '', entwurf = null, aktuelleId = null, syncLaeuft = false;

/* ---------- Werkzeug ---------- */
const z = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
const eur = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const datum = s => s ? new Date(s+'T00:00:00').toLocaleDateString('de-DE') : '–';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Arbeitswerte (AW): 1 AW = ein Zehntel Stunde ---------- */
function awStundensatz(){ return z((daten.settings && daten.settings.aw) || 0) * 10; }

function migriereAW(d){
  if(!d || !d.settings) return d;
  if(d.settings.aw === undefined || d.settings.aw === ''){
    const std = z(d.settings.stundensatz);
    d.settings.aw = std ? Math.round((std / 10) * 100) / 100 : VORGABE.aw;
  }
  (d.auftraege || []).forEach(a =>{
    (a.teile || []).forEach(p =>{ if(!p.einheit) p.einheit = 'stk'; });
    (a.arbeit || []).forEach(p =>{
      if(!p.einheit) p.einheit = 'aw';
      if(p.aw === undefined && p.std !== undefined){
        p.aw = z(p.std) ? Math.round(z(p.std) * 10 * 100) / 100 : '';
        p.satz = z(p.satz) ? Math.round((z(p.satz) / 10) * 100) / 100 : d.settings.aw;
        delete p.std;
      }
    });
  });
  return d;
}

function summen(a){
  const satz = daten.settings.kleinunternehmer ? 0 : (daten.settings.mwst === undefined || daten.settings.mwst === '' ? 19 : z(daten.settings.mwst));
  const brutto1 = preisModus(a) === 'brutto';
  const raus = w => brutto1 ? w / (1 + satz/100) : w;
  const arbeit = raus((a.arbeit||[]).reduce((s,p)=>s+z(p.aw)*z(p.satz),0));
  const teile  = raus((a.teile||[]).reduce((s,p)=>s+z(p.menge)*z(p.preis),0));
  const netto = arbeit+teile;
  const steuer = netto*satz/100;
  return {arbeit,teile,netto,steuer,brutto:netto+steuer,satz,modus:preisModus(a)};
}
function preisModus(a){
  return (a && a.preisModus) || (daten.settings && daten.settings.preisModus) || 'netto';
}
function neueNummer(){
  const j = new Date().getFullYear();
  const max = daten.auftraege.filter(a=>(a.nummer||'').startsWith(j+'-'))
    .reduce((m,a)=>Math.max(m,parseInt((a.nummer||'').split('-')[1]||0,10)),0);
  return j+'-'+String(max+1).padStart(3,'0');
}
let meldeLauf=null;
function melden(t,fehler){
  const e=document.getElementById('meldung');
  e.textContent=t; e.className='meldung'+(fehler?' fehler':''); e.hidden=false;
  clearTimeout(meldeLauf); meldeLauf=setTimeout(()=>e.hidden=true, fehler?6000:2000);
}
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function zustand(art, text){
  document.getElementById('punkt').className = 'punkt '+art;
  document.getElementById('syncText').textContent = text;
}

/* ---------- Anmeldung & Drive ---------- */
function gisBereit(){ return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2; }
function tokenGueltig(){ return !!token && Date.now() < tokenBis; }
function tokenMerken(t, sekunden){
  token = t;
  tokenBis = Date.now() + (Math.max(60, sekunden||3600) - 90) * 1000;
  lsSet('werkstatt-token', JSON.stringify({t: token, bis: tokenBis}));
}
function tokenHolenAusSpeicher(){
  try{
    const g = JSON.parse(lsGet('werkstatt-token') || 'null');
    if(g && g.t && Date.now() < g.bis){ token = g.t; tokenBis = g.bis; return true; }
  }catch(e){}
  return false;
}
function tokenVerwerfen(){
  token = null; tokenBis = 0;
  try{ localStorage.removeItem('werkstatt-token'); }catch(e){}
}
function anmelden(interaktiv){
  if(!interaktiv && tokenGueltig()) return Promise.resolve(token);
  return new Promise((ok,fehl)=>{
    if(!cfg.clientId) return fehl(new Error('Keine Client-ID hinterlegt'));
    if(!gisBereit()) return fehl(new Error('Google-Anmeldung nicht geladen – Internetverbindung prüfen'));
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId, scope: SCOPE,
      callback: r => r.access_token ? (tokenMerken(r.access_token, r.expires_in), ok(token))
                                    : fehl(new Error('Anmeldung abgebrochen')),
      error_callback: e => fehl(new Error(e && e.type === 'popup_closed' ? 'Anmeldefenster geschlossen' : 'Anmeldung fehlgeschlagen'))
    });
    const wunsch = {prompt: interaktiv ? 'consent' : ''};
    if(cfg.konto) wunsch.hint = cfg.konto;
    tokenClient.requestAccessToken(wunsch);
  });
}
async function api(url, opt){
  opt = opt || {};
  if(!tokenGueltig()) await anmelden(false);
  const ruf = () => fetch(url, Object.assign({}, opt, {
    headers: Object.assign({Authorization:'Bearer '+token}, opt.headers||{})
  }));
  let r = await ruf();
  if(r.status === 401){
    tokenVerwerfen();
    try{ await anmelden(false); }
    catch(e){ throw new Error('Anmeldung abgelaufen – bitte unter Konto neu verbinden'); }
    r = await ruf();
  }
  if(!r.ok){
    let grund = '';
    try{
      const j = await r.clone().json();
      grund = (j.error && (j.error.message || j.error.status)) || '';
    }catch(e){ try{ grund = (await r.clone().text()).slice(0,200); }catch(e2){} }
    throw new Error('Google meldet ' + r.status + (grund ? ': ' + grund : ''));
  }
  return r;
}
async function dateiSuchen(){
  const q = encodeURIComponent("name = '" + cfg.dateiName.replace(/'/g,"\\'") + "' and trashed = false");
  const r = await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)&pageSize=10');
  const j = await r.json();
  if(!j.files || !j.files.length) throw new Error('Datei ' + cfg.dateiName + ' nicht in Drive gefunden');
  dateiId = j.files[0].id;
  return j.files[0];
}
async function standLesen(){
  const r = await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?fields=modifiedTime');
  return (await r.json()).modifiedTime;
}
async function kontoErmitteln(){
  if(cfg.konto) return;
  try{
    const r = await api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)');
    const u = (await r.json()).user;
    if(u && u.emailAddress){ cfg.konto = u.emailAddress; lsSet('werkstatt-cfg', JSON.stringify(cfg)); }
  }catch(e){}
}
async function holen(still){
  if(syncLaeuft) return;
  syncLaeuft = true;
  try{
    zustand('laeuft','Lade …');
    if(!dateiId) await dateiSuchen();
    const r = await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?alt=media');
    const g = await r.json();
    daten = Object.assign({version:1,auftraege:[]}, g);
    daten.settings = Object.assign({}, VORGABE, g.settings||{});
    daten.auftraege = Array.isArray(g.auftraege) ? g.auftraege : [];
    migriereAW(daten);
    standDrive = await standLesen();
    await kontoErmitteln();
    lsSet('werkstatt-cache', JSON.stringify(daten));
    render();
    zustand('an','Stand ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    if(!still) melden(daten.auftraege.length + ' Aufträge geladen');
  }catch(e){
    zustand('aus', e.message);
    if(!still) melden(e.message, true);
  }finally{ syncLaeuft = false; }
}
async function schreiben(){
  if(!dateiId) await dateiSuchen();
  const jetzt = await standLesen();
  if(standDrive && jetzt !== standDrive){
    if(!confirm('Die Datei wurde zwischenzeitlich auf einem anderen Gerät geändert.\n\nOK = Deine Änderung trotzdem speichern (die andere geht verloren)\nAbbrechen = erst neu laden')){
      await holen(); throw new Error('Nicht gespeichert – bitte Änderung erneut eintragen');
    }
  }
  const r = await api('https://www.googleapis.com/upload/drive/v3/files/'+dateiId+'?uploadType=media',
    {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(daten, null, 2)});
  standDrive = (await r.json()).modifiedTime || await standLesen();
  lsSet('werkstatt-cache', JSON.stringify(daten));
  zustand('an','Gespeichert ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
}
async function sichern(){
  try{ zustand('laeuft','Speichere …'); await schreiben(); melden('In Drive gespeichert'); }
  catch(e){ zustand('aus','Nicht gespeichert'); melden(e.message, true); }
}


/* ---------- Bilder anhängen (Ablage oder Foto) ---------- */
async function bilderAnhaengen(dateien, feld){
  if(feld) feld.value = '';
  if(!dateien || !dateien.length) return;
  uebernehmen();
  entwurf.bilder = entwurf.bilder || [];
  for(const d of dateien){
    try{
      melden('Lade ' + d.name + ' hoch …');
      entwurf.bilder.push(await bildHochladen(d, entwurf.nummer));
    }catch(err){ melden('Hochladen fehlgeschlagen: ' + err.message, true); }
  }
  zeichne();
  melden(dateien.length > 1 ? dateien.length + ' Bilder angehängt' : 'Bild angehängt');
}

/* ---------- Fahrzeugschein aus angehängtem Bild wählen ---------- */

  uebernehmen();
  const bilder = entwurf.bilder || [];

    + '<p class="notiz">Tippe das Bild an, das ausgelesen werden soll.</p>'
    + '<div class="bilder">' + bilder.map((x,i)=>

    + '<div class="aktionen" style="position:static;border:0;padding:12px 0 0">'
    + '<button class="k2" id="scheinWahlAb">Abbrechen</button></div>';
  document.getElementById('scheinbox').hidden = false;
  document.getElementById('scheinWahlAb').onclick = scheinSchliessen;
  b.querySelectorAll('.bildkachel').forEach(async kachel=>{
    const i = +kachel.dataset.wahl, bild = bilder[i];
    kachel.onclick = ()=> scheinLesen(bild);
    try{
      const url = await bildUrl(bild);
      const img = document.createElement('img'); img.src = url; img.alt = bild.name;
      kachel.querySelector('.lade')?.remove(); kachel.insertBefore(img, kachel.firstChild);
    }catch(e){ const t = kachel.querySelector('.lade'); if(t) t.textContent = 'nicht ladbar'; }
  });
}

const SCHEINFELDER = [
  {id:'kennzeichen', bez:'Kennzeichen'},
  {id:'fin',         bez:'FIN'},
  {id:'marke',       bez:'Marke'},
  {id:'modell',      bez:'Modell'},
  {id:'vorname',     bez:'Vorname'},
  {id:'nachname',    bez:'Nachname'},
  {id:'strasse',     bez:'Straße'},
  {id:'plz',         bez:'PLZ'},
  {id:'ort',         bez:'Ort'},

];

function tesseractLaden(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((ok,fehl)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ok;
    s.onerror = ()=> fehl(new Error('Texterkennung konnte nicht geladen werden – Internetverbindung nötig'));
    document.head.appendChild(s);
  });
}

function scheinAuswerten(roh){
  const text = String(roh||'').replace(/\u00a0/g,' ');
  const zeilen = text.split('\n').map(z=>z.trim()).filter(Boolean);
  const treffer = re => { const m = text.match(re); return m ? (m[1]||m[0]).trim() : ''; };
  const saeubern = s => String(s||'').replace(/[|_]+/g,' ').replace(/\s{2,}/g,' ').trim();

  // Aufgedruckte Beschriftungen des Vordrucks. Alles bis einschliesslich des
  // LETZTEN Vorkommens wird abgeschnitten – so ueberleben auch verstuemmelte
  // Fassungen wie "Ne oder Firmenname" statt "Name oder Firmenname".
  const BESCHRIFTUNGEN = /(firmenname|vorname\(?n?\)?|vornamen|anschrift|amtliches\s+kennzeichen|kennzeichen|handelsbezeichnung(?:\(en\)|en)?|fahrzeug-?identifizierungsnummer|identifizierungsnummer|erstzulassung|hubraum|fahrzeugklasse|aufbau(?:art)?|hauptuntersuchung|leistung|marke|typ,?\s*variante,?\s*version|name)/gi;

  // Wortanfaenge des Vordrucks – faengt auch Lesefehler wie "Firmer" statt "Firmenname"
  const STAEMME = ['firm','vorname','vornam','anschr','kennz','amtl','handelsb','identifiz',
    'erstzul','hubr','fahrzeugkl','aufbau','hauptunt','marke','variant','version','name','oder',
    'ggf','zweiter','zweite','und','naechste','nächste','datum','halter','vonum','vorn','vnam'];

  const ohneBeschriftung = t => {
    let s = String(t||'').trim();
    // Erster Durchgang: bis hinter das letzte vollstaendig erkannte Beschriftungswort
    let ende = 0;
    BESCHRIFTUNGEN.lastIndex = 0;
    let m;
    while((m = BESCHRIFTUNGEN.exec(s)) !== null) ende = m.index + m[0].length;
    s = s.slice(ende).replace(/^[\s:.)\-–—]+/,'').trim();
    // Zweiter Durchgang: fuehrende Wortreste abschneiden
    const woerter = s.split(/\s+/).filter(Boolean);
    let i = 0;
    while(i < woerter.length){
      const roh = woerter[i];
      const w = roh.toLowerCase().replace(/[()\[\]{}.,:;\-–—\/|_]/g,'');
      // "Vorname(n)", "Vomame(n)" – die Klammerform verraet die Beschriftung
      if(/\(\s*n\s*\)\.?$/i.test(roh)){ i++; continue; }
      if(STAEMME.some(st => w.startsWith(st))) i++; else break;
    }
    return woerter.slice(i).join(' ').trim();
  };

  const istCode = t => /^[A-Z]{1,2}\.?\d?(\.\d)?$/i.test(String(t||'').trim());
  // Zeile beginnt mit einem anderen Codefeld, z.B. "C.1.2 Vorname(n)"
  const beginntMitCode = t => /^[A-Z][.\s]?[0-9lIt|]([.\s]?[0-9lIt|])?[\s:.)-]/i.test(String(t||'').trim());
  const brauchbar = t => {
    const n = String(t||'').trim();
    return n.length > 1 && !istCode(n);
  };

  // Wert zu einem Codefeld: erst der Zeilenrest, dann die Folgezeilen
  // Codefelder werden oft verstuemmelt gelesen: "C1.1", "Ct.2", "C3.8", "D3".
  // Deshalb Punkte optional und die Ziffer 1 auch als l, I, t oder | zulassen.
  const codeMuster = code => {
    const teil = code.split('').map(z =>
      z === '.' ? '[.\\s]?' :
      z === '1' ? '[1lIt|]' :
      z.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('');
    return new RegExp('(?:^|[^A-Za-z0-9.])' + teil + '(?![A-Za-z0-9])[\\s:.)-]*(.*)$');
  };

  const nachCode = (code, maxZeilen, pruef) => {
    const passt = v => brauchbar(v) && (!pruef || pruef(v));
    const muster = codeMuster(code);
    for(let i=0;i<zeilen.length;i++){
      const m = zeilen[i].match(muster);
      if(!m) continue;
      const rest = ohneBeschriftung(m[1]||'');
      if(passt(rest)) return rest;
      const bis = Math.min(i + (maxZeilen||3) + 1, zeilen.length);
      for(let j=i+1;j<bis;j++){
        const zeile = zeilen[j].trim();
        if(istCode(zeile) || beginntMitCode(zeile)) break;   // naechstes Codefeld erreicht
        const n = ohneBeschriftung(zeile);
        if(passt(n)) return n;
      }
    }
    return '';
  };

  // Ersatzanker: ueber das Beschriftungswort, wenn der Code unlesbar ist
  const nachWort = (wortRe, maxZeilen, pruef) => {
    const passt = v => brauchbar(v) && (!pruef || pruef(v));
    for(let i=0;i<zeilen.length;i++){
      const m = zeilen[i].match(wortRe);
      if(!m) continue;
      const rest = ohneBeschriftung(zeilen[i].slice(m.index + m[0].length));
      if(passt(rest)) return rest;
      const bis = Math.min(i + (maxZeilen||3) + 1, zeilen.length);
      for(let j=i+1;j<bis;j++){
        const zeile = zeilen[j].trim();
        if(istCode(zeile) || beginntMitCode(zeile)) break;
        const n = ohneBeschriftung(zeile);
        if(passt(n)) return n;
      }
    }
    return '';
  };

  // Erst ueber den Code, sonst ueber das Beschriftungswort
  const feldWert = (code, wortRe, maxZeilen, pruef) =>
    nachCode(code, maxZeilen, pruef) || (wortRe ? nachWort(wortRe, maxZeilen, pruef) : '');

  // Alle Folgezeilen eines Codefelds (fuer die Anschrift)
  const blockNachCode = (code, anzahl, wortRe) => {
    const muster = codeMuster(code);
    for(let i=0;i<zeilen.length;i++){
      const m = zeilen[i].match(muster) || (wortRe ? zeilen[i].match(wortRe) : null);
      if(!m) continue;
      const aus = [];
      const rest = ohneBeschriftung(m[1] !== undefined ? m[1] : zeilen[i].slice(m.index + m[0].length));
      if(brauchbar(rest)) aus.push(rest);
      for(let j=i+1;j<zeilen.length && aus.length<(anzahl||2);j++){
        const zeile = zeilen[j].trim();
        if(istCode(zeile) || beginntMitCode(zeile)) break;
        const n = ohneBeschriftung(zeile);
        if(brauchbar(n)) aus.push(n);
      }
      if(aus.length) return aus;
    }
    return [];
  };

  // ---- Fahrzeug-Identifizierungsnummer: 17 Zeichen, sonst nichts ----
  let fin = treffer(/\b([A-HJ-NPR-Z0-9]{17})\b/);
  if(!fin){
    const e = nachCode('E').replace(/[^A-HJ-NPR-Z0-9]/gi,'').toUpperCase();
    if(e.length === 17) fin = e;
  }

  // ---- Kennzeichen: bevorzugt aus Feld A ----
  const kennzFormen = s => {
    const m = String(s||'').toUpperCase()
      .match(/(?:^|[^A-ZÄÖÜ0-9])([A-ZÄÖÜ]{1,3})[\s\-–—·]{0,3}([A-ZÄÖÜ]{1,2})[\s\-–—]{0,3}(\d{1,4})\s?([EH])?(?![0-9])/);
    return m ? m[1] + '-' + m[2] + ' ' + m[3] + (m[4] || '') : '';
  };
  let kennzeichen = '';
  // Bei diesem Vordruck stehen zwischen Beschriftung und Wert oft fremde Zeilen,
  // deshalb die naechsten Zeilen nach einem Kennzeichen-Muster absuchen
  for(let i=0;i<zeilen.length && !kennzeichen;i++){
    if(!/amtliches\s+kennzeichen|^A[\s:.)-]/i.test(zeilen[i])) continue;
    for(let j=i;j<Math.min(i+7, zeilen.length);j++){
      const zeile = (j === i) ? zeilen[j].replace(/.*kennzeichen/i,'') : zeilen[j];
      if(fin && zeile.includes(fin)) continue;
      const k = kennzFormen(zeile);
      if(k){ kennzeichen = k; break; }
    }
  }
  if(!kennzeichen){
    // Notnagel: irgendwo im Text, aber nie innerhalb der FIN oder einer Belegnummer
    const ohneFin = text.split(fin || '\u0000').join(' ').replace(/\b[A-ZÄÖÜ]{2,3}-[A-Z]-\d[^\s]*/g,' ');
    kennzeichen = kennzFormen(ohneFin);
  }

  // ---- Marke: ueber bekannte Hersteller, weil der Wert weit vom Code steht ----
  const HERSTELLER = ['HONDA','YAMAHA','SUZUKI','KAWASAKI','BMW','KTM','DUCATI','TRIUMPH',
    'HARLEY-DAVIDSON','HARLEY DAVIDSON','APRILIA','MOTO GUZZI','PIAGGIO','VESPA','HUSQVARNA',
    'HUSABERG','ROYAL ENFIELD','MV AGUSTA','BENELLI','INDIAN','CFMOTO','CF MOTO','SYM','KYMCO',
    'PEUGEOT','DERBI','GILERA','BETA','GASGAS','GAS GAS','SHERCO','SWM','FANTIC','MASH','BRIXTON',
    'VOGE','QJ MOTOR','KEEWAY','ZONTES','SIMSON','MZ','HYOSUNG','BUELL','VICTORY','ZERO','NIU',
    'MERCEDES-BENZ','VOLKSWAGEN','AUDI','OPEL','FORD','SKODA','SEAT','RENAULT','FIAT','TOYOTA'];
  const gross = text.toUpperCase();
  let marke = '';
  for(const h of HERSTELLER){
    if(new RegExp('\\b' + h.replace(/[-\s]/g,'[-\\s]') + '\\b').test(gross)){
      if(h.length > marke.length) marke = h;
    }
  }
  if(!marke){
    const d1 = saeubern(nachCode('D.1'));
    if(/[A-Za-zÄÖÜäöüß]{2,}/.test(d1)) marke = d1;
  }

  // ---- Modell: Codefeld, sonst laengste Buchstaben-Ziffern-Marke im Text ----
  let modell = saeubern(nachCode('D.3', 3, v => !/^\d+$/.test(v)));
  if(!/[A-Za-zÄÖÜäöüß]{2,}/.test(modell)) modell = '';
  if(!modell){
    const kandidaten = (text.match(/\b[A-Z][A-Z0-9\-]{3,19}\b/g) || []).filter(w =>
      /[A-Z]/.test(w) && /[0-9]/.test(w) &&           // Buchstaben UND Ziffern
      w !== fin && w.length !== 17 &&                  // nicht die FIN
      !/^\d/.test(w) &&                                // nicht mit Ziffer beginnend
      !/ZR|\//.test(w) &&                              // keine Reifengroesse
      (w.match(/-/g)||[]).length < 2 &&                 // keine Belegnummer wie FN-K-0-124
      !HERSTELLER.includes(w));
    kandidaten.sort((a,b)=> b.length - a.length);
    modell = kandidaten[0] || '';
  }

  // ---- Erstzulassung: das aelteste Datum auf dem Schein ----
  // Feld B ist die Erstzulassung – wenn dort ein Datum steht, gilt es
  const datumFeldB = () => {
    const v = nachCode('B', 2, x => /\b\d{2}[.\/]\d{2}[.\/]\d{4}\b/.test(x));
    const m = v && v.match(/\b(\d{2}[.\/]\d{2}[.\/]\d{4})\b/);
    return m ? m[1].replace(/\//g,'.') : '';
  };

  // Alle Datumsangaben, aufsteigend – zur Auswahl im Prueffenster
  const alleDaten = () => {
    const roh = text.match(/\b\d{2}[.\/]\d{2}[.\/]\d{4}\b/g) || [];
    const einmalig = [...new Set(roh.map(d => d.replace(/\//g,'.')))];
    return einmalig.sort((a,b)=>{
      const z = d => { const t = d.split('.'); return +t[2]*10000 + +t[1]*100 + +t[0]; };
      return z(a) - z(b);
    });
  };

  // Ohne lesbares Feld B: das mittlere Datum. Das aelteste ist meist die
  // Typgenehmigung, das neueste das Ausstellungsdatum der Bescheinigung.
  const mittleresDatum = () => {
    const liste = alleDaten();
    if(!liste.length) return '';
    return liste[Math.floor((liste.length - 1) / 2)];
  };

  const aeltestesDatum = () => {
    const alle = text.match(/\b(\d{2})[.\/](\d{2})[.\/](\d{4})\b/g) || [];
    let bestes = '', wert = Infinity;
    for(const d of alle){
      const t = d.match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/);
      const zahl = +t[3] * 10000 + +t[2] * 100 + +t[1];
      if(zahl < wert){ wert = zahl; bestes = d.replace(/\//g,'.'); }
    }
    return bestes;
  };

  // ---- Halter: C.1.2 Vornamen + C.1.1 Nachname ----
  // Namen: keine Ziffern, kein Geburtsname, mindestens drei Zeichen
  // (faengt Reste wie "de" aus "Name oder ..." ab)
  const ohneGeburtsname = v => v.replace(/\s*\bgeb\.?\b.*$/i,'').trim();
  const istName = v => !/\d/.test(v) && !/^geb\b/i.test(v.trim())
    && !/\(\s*n\s*\)/i.test(v) && ohneGeburtsname(v).length > 2;
  const nachname = ohneGeburtsname(saeubern(
    feldWert('C.1.1', /\bname\b(?!.*vorname)/i, 4, istName)));
  const vornamen = ohneGeburtsname(saeubern(
    feldWert('C.1.2', /vorname|vornamen|vonume|vorn\w*/i, 4, istName)));
  const kunde = [vornamen, nachname].filter(Boolean).join(' ');

  // ---- Anschrift aus C.1.3 ----
  const anschrift = blockNachCode('C.1.3', 2, /anschrift/i);
  let strasse = '', plz = '', ort = '';
  for(const z of anschrift){
    const m = z.match(/\b(\d{5})\s+(.+)$/);
    if(m){ plz = m[1]; ort = saeubern(m[2]); }
    else if(!strasse && /[A-Za-zÄÖÜäöüß]{3,}/.test(z)) strasse = saeubern(z);
  }

  // Steht die Marke vorne im Modell, wird sie dort entfernt: "KTM 125 DUKE" -> "125 DUKE"
  if(marke && modell){
    const ohneMarke = modell.replace(new RegExp('^' + marke.replace(/[-\s]/g,'[-\\s]') + '[\\s-]+','i'),'').trim();
    if(ohneMarke.length > 1) modell = ohneMarke;
  }

  return {
    kennzeichen: (kennzeichen||'').toUpperCase(),
    fin: (fin||'').toUpperCase(),
    marke: marke,
    modell: modell,
    vorname: vornamen,
    nachname: nachname,
    kunde: kunde,
    strasse: strasse,
    plz: plz,
    ort: ort,
    erstzul: datumFeldB() || mittleresDatum(),
    datumListe: alleDaten(),
    rohtext: text
  };
}

/* ---------- Fahrzeugschein mit Googles Drive-Texterkennung ---------- */
function scheinWeg(){
  return lsGet('werkstatt-scheinweg') || 'drive';
}

// Bild verkleinern: Drive verlangt hoechstens 2 MB
async function bildVerkleinern(blob){
  if(blob.size < 1600000) return blob;
  const bild = await new Promise((ok, fehl)=>{
    const i = new Image();
    i.onload = ()=> ok(i);
    i.onerror = ()=> fehl(new Error('Bild konnte nicht gelesen werden'));
    i.src = URL.createObjectURL(blob);
  });
  const kante = 2200;
  const f = Math.min(1, kante / Math.max(bild.width, bild.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bild.width * f);
  c.height = Math.round(bild.height * f);
  c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
  const klein = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
  return (klein && klein.size < blob.size) ? klein : blob;
}

/* ---------- Bild aufbereiten: zuschneiden und richtig drehen ---------- */

function bildLaden(blob){
  return new Promise((ok, fehl)=>{
    const i = new Image();
    const url = URL.createObjectURL(blob);
    i.onload = ()=>{ URL.revokeObjectURL(url); ok(i); };
    i.onerror = ()=>{ URL.revokeObjectURL(url); fehl(new Error('Bild konnte nicht gelesen werden')); };
    i.src = url;
  });
}

function alsBlob(leinwand, guete){
  return new Promise(ok => leinwand.toBlob(ok, 'image/jpeg', guete || 0.88));
}

// Schneidet den Rand weg: sucht den Bereich mit den kraeftigen Kanten,
// also den Schein selbst, und laesst die ruhige Umgebung fallen.
async function bildZuschneiden(blob){
  try{
    const bild = await bildLaden(blob);
    const probe = 1000;
    const f = Math.min(1, probe / Math.max(bild.width, bild.height));
    const w = Math.max(40, Math.round(bild.width * f));
    const h = Math.max(40, Math.round(bild.height * f));

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(bild, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;

    const grau = new Float32Array(w * h);
    for(let i = 0, p = 0; p < grau.length; i += 4, p++)
      grau[p] = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;

    // Kantenstaerke je Spalte und Zeile zaehlen
    const spalte = new Float32Array(w), zeile = new Float32Array(h);
    for(let y = 1; y < h - 1; y++){
      for(let x = 1; x < w - 1; x++){
        const i = y * w + x;
        const staerke = Math.abs(grau[i+1] - grau[i-1]) + Math.abs(grau[i+w] - grau[i-w]);
        if(staerke > 26){ spalte[x]++; zeile[y]++; }
      }
    }

    const grenzen = (werte, laenge)=>{
      let hoch = 0;
      for(let i = 0; i < laenge; i++) if(werte[i] > hoch) hoch = werte[i];
      if(hoch < 3) return null;
      const schwelle = hoch * 0.10;
      let a = 0, b = laenge - 1;
      while(a < laenge && werte[a] < schwelle) a++;
      while(b > a && werte[b] < schwelle) b--;
      return (b - a) > laenge * 0.25 ? [a, b] : null;
    };

    const gx = grenzen(spalte, w), gy = grenzen(zeile, h);
    if(!gx || !gy) return blob;

    // Etwas Rand stehen lassen, damit nichts abgeschnitten wird
    const luft = 0.02;
    const x0 = Math.max(0, (gx[0] / w - luft)) * bild.width;
    const x1 = Math.min(1, (gx[1] / w + luft)) * bild.width;
    const y0 = Math.max(0, (gy[0] / h - luft)) * bild.height;
    const y1 = Math.min(1, (gy[1] / h + luft)) * bild.height;
    const bw = Math.round(x1 - x0), bh = Math.round(y1 - y0);

    // Nur zuschneiden, wenn es sich lohnt und genug uebrig bleibt
    const anteil = (bw * bh) / (bild.width * bild.height);
    if(anteil > 0.92 || anteil < 0.12) return blob;

    const z = document.createElement('canvas');
    z.width = bw; z.height = bh;
    z.getContext('2d').drawImage(bild, Math.round(x0), Math.round(y0), bw, bh, 0, 0, bw, bh);
    const neu = await alsBlob(z);
    return neu || blob;
  }catch(e){
    return blob;   // im Zweifel das Bild unveraendert lassen
  }
}

async function bildDrehen(blob, grad){
  if(!grad) return blob;
  const bild = await bildLaden(blob);
  const quer = (grad === 90 || grad === 270);
  const c = document.createElement('canvas');
  c.width  = quer ? bild.height : bild.width;
  c.height = quer ? bild.width  : bild.height;
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(grad * Math.PI / 180);
  ctx.drawImage(bild, -bild.width / 2, -bild.height / 2);
  return (await alsBlob(c)) || blob;
}

// Wie sehr sieht der erkannte Text nach einem Fahrzeugschein aus?
function scheinGuete(text){
  const t = String(text || '');
  if(t.trim().length < 20) return 0;
  const merkmale = [
    /zulassungsbescheinigung/i, /fahrzeugschein/i, /amtliches\s*kennz/i,
    /anschrift/i, /firmenname/i, /vorname/i, /erstzulassung/i,
    /\bC[.\s]?[1lIt|][.\s]?[1lIt|]\b/, /\bD[.\s]?[1lIt|]\b/, /\bD[.\s]?3\b/,
    /\b[A-HJ-NPR-Z0-9]{17}\b/, /\b\d{2}\.\d{2}\.\d{4}\b/, /\b\d{5}\s+[A-ZÄÖÜ][a-zäöüß]{2,}/
  ];
  let punkte = merkmale.reduce((s, re)=> s + (re.test(t) ? 1 : 0), 0);
  // Anteil sinnvoller Woerter
  const woerter = t.match(/[A-Za-zÄÖÜäöüß]{4,}/g) || [];
  if(woerter.length > 12) punkte += 1;
  if(woerter.length > 30) punkte += 1;
  return punkte;
}

async function scheinLesenDrive(datei){
  scheinFortschritt('Bild wird vorbereitet …', 0.1);
  const bild = await bildVerkleinern(datei);
  if(bild.size > 2000000) throw new Error('Bild ist auch verkleinert zu groß für die Drive-Texterkennung');

  // Bild als Google-Dokument hochladen – dabei liest Drive den Text
  scheinFortschritt('Bild wird an Drive übergeben …', 0.3);
  const grenze = 'werkstatt' + Date.now();
  const kopf = {name: 'Texterkennung ' + new Date().toISOString(), mimeType: 'application/vnd.google-apps.document'};
  const rumpf = new Blob([
    '--' + grenze + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
    JSON.stringify(kopf) + '\r\n',
    '--' + grenze + '\r\nContent-Type: ' + (bild.type || 'image/jpeg') + '\r\n\r\n',
    bild,
    '\r\n--' + grenze + '--\r\n'
  ]);
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&ocrLanguage=de',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + grenze}, body: rumpf});
  const dok = (await r.json()).id;
  if(!dok) throw new Error('Drive hat kein Dokument angelegt');

  try{
    scheinFortschritt('Text wird abgeholt …', 0.7);
    const t = await api('https://www.googleapis.com/drive/v3/files/' + dok + '/export?mimeType=text/plain');
    const text = await t.text();
    return text;
  }finally{
    // Hilfsdokument wieder entfernen, damit das Drive nicht zuwuchert
    try{ await api('https://www.googleapis.com/drive/v3/files/' + dok, {method:'DELETE'}); }catch(e){}
  }
}

async function scheinLesen(quelle){
  try{
    scheinFortschritt('Bild wird geladen …', 0.02);
    const roh = (quelle instanceof Blob) ? quelle : await (await fetch(await bildUrl(quelle))).blob();

    scheinFortschritt('Schein wird freigestellt …', 0.06);
    const datei = await bildZuschneiden(roh);

    let text = '';
    if(scheinWeg() === 'drive'){
      try{
        text = await scheinLesenDreh(datei);
      }catch(eDrive){
        melden('Drive-Texterkennung nicht möglich (' + eDrive.message + ') – ich lese im Browser.', true);
        text = await scheinLesenBrowser(datei);
      }
    }else{
      text = await scheinLesenBrowser(datei);
    }
    scheinPruefen(scheinAuswerten(text));
  }catch(e){
    scheinSchliessen();
    melden(e.message || 'Texterkennung fehlgeschlagen', true);
  }
}

// Probiert die Lagen durch und nimmt die, in der der Text am meisten
// nach einem Fahrzeugschein aussieht. Bricht ab, sobald es eindeutig ist.
async function scheinLesenDreh(datei){
  const lagen = [0, 90, 270, 180];
  let bestes = {text:'', punkte:-1, grad:0};
  for(let i = 0; i < lagen.length; i++){
    const grad = lagen[i];
    scheinFortschritt(grad ? 'Prüfe Lage ' + grad + '° …' : 'Bild wird gelesen …', 0.1 + i * 0.2);
    let text = '';
    try{
      text = await scheinLesenDrive(await bildDrehen(datei, grad));
    }catch(e){
      if(i === 0) throw e;
      continue;
    }
    const punkte = scheinGuete(text);
    if(punkte > bestes.punkte) bestes = {text, punkte, grad};
    if(punkte >= 6) break;
  }
  if(bestes.grad) melden('Bild war um ' + bestes.grad + '° gedreht – automatisch berichtigt.');
  return bestes.text;
}

async function scheinLesenBrowser(datei){
  scheinFortschritt('Texterkennung wird geladen …', 0);
  await tesseractLaden();
  scheinFortschritt('Bild wird gelesen …', 0.05);
  const erg = await Tesseract.recognize(datei, 'deu', {
    logger: m => { if(m.status === 'recognizing text') scheinFortschritt('Bild wird gelesen …', m.progress); }
  });
  return (erg.data && erg.data.text) || '';
}

/* ---------- Freisprechmodus: diktieren ohne Anfassen ---------- */
let hoerer = null, hoertZu = false, diktatZiel = 'anliegen', diktatWach = null, diktatBlockOffen = false;
let finalsGeschrieben = 0, letzterSatz = '', letzterSatzZeit = 0;
const istAndroid = /Android/i.test((navigator && navigator.userAgent) || '');

function spracheDa(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

const DIKTATFELDER = {
  anliegen: {feld:'fAnliegen', bez:'Auftragsumfang'},
  notiz:    {feld:'fNotiz',    bez:'Interne Notiz'}
};

function diktatAnzeigen(vorlaeufig){
  const ziel = DIKTATFELDER[diktatZiel];
  document.getElementById('diktatZiel').textContent = ziel.bez;
  const fest = (entwurf && entwurf[diktatZiel]) || '';
  document.getElementById('diktatText').innerHTML =
    esc(fest) + (vorlaeufig ? '<span class="vorlaeufig"> ' + esc(vorlaeufig) + '</span>' : '');
  const k = document.getElementById('diktatText');
  k.scrollTop = k.scrollHeight;
}

function diktatStand(t){ document.getElementById('diktatStand').textContent = t || ''; }

// Erkennt gesprochene Befehle. Gibt true zurueck, wenn der Satz ein Befehl war.
function diktatBefehl(satz){
  const s = satz.toLowerCase().replace(/[.,!?]/g,'').trim();
  if(/^(auftragsumfang|auftrag umfang|kundenangabe)$/.test(s)){
    diktatZiel = 'anliegen'; diktatAnzeigen(); melden('Diktat: Auftragsumfang'); return true;
  }
  if(/^((interne )?notiz|befund)$/.test(s)){
    diktatZiel = 'notiz'; diktatBlockOffen = false; diktatAnzeigen(); melden('Diktat: Interne Notiz'); return true;
  }
  if(/^(neuer auftrag|nächster auftrag|naechster auftrag)$/.test(s)){
    diktatNeu(); return true;
  }
  if(/^(speichern|auftrag speichern|sichern)$/.test(s)){
    diktatSpeichern(); return true;
  }
  if(/^(ende|stopp|stop|beenden|fertig|schluss)$/.test(s)){
    diktatBeenden(); return true;
  }
  if(/^(zurücknehmen|zurueck nehmen|letzten satz löschen|loeschen)$/.test(s)){
    const t = (entwurf[diktatZiel]||'').trim().split(/(?<=[.!?])\s+/);
    t.pop();
    entwurf[diktatZiel] = t.join(' ');
    diktatAnzeigen(); melden('Letzter Satz entfernt'); return true;
  }
  return false;
}

// Ein fertig erkannter Satz: erst Befehl pruefen, sonst schreiben.
// Wiederholt Android denselben Satz binnen weniger Sekunden, wird er verworfen.
function diktatVerarbeiten(stueck){
  const satz = String(stueck||'').trim();
  if(!satz) return;
  const schluessel = satz.toLowerCase().replace(/[.,!?]/g,'');
  const jetzt = Date.now();
  if(schluessel === letzterSatz && (jetzt - letzterSatzZeit) < 5000) return;
  letzterSatz = schluessel;
  letzterSatzZeit = jetzt;
  if(!diktatBefehl(satz)) diktatSchreiben(satz);
}

function heuteKurz(){
  return new Date().toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function diktatSchreiben(satz){
  const rein = satz.trim().replace(/^\w/, c => c.toUpperCase());
  if(!rein) return;
  const bisher = entwurf[diktatZiel] || '';
  const punkt = rein + (/[.!?]$/.test(rein) ? '' : '.');

  // Jedes Diktat in die Notiz beginnt eine neue Zeile mit dem Tagesdatum
  if(diktatZiel === 'notiz' && !diktatBlockOffen){
    entwurf.notiz = (bisher ? bisher.replace(/\s*$/,'') + '\n' : '') + heuteKurz() + ': ' + punkt;
    diktatBlockOffen = true;
  }else{
    entwurf[diktatZiel] = (bisher ? bisher.replace(/\s*$/,'') + ' ' : '') + punkt;
  }
  diktatAnzeigen();
}

async function diktatNeu(){
  await diktatSpeichern(true);
  editor(null);
  document.getElementById('diktat').hidden = false;   // Editor blendet das Fenster sonst aus
  diktatZiel = 'anliegen';
  diktatBlockOffen = false;
  diktatAnzeigen();
  melden('Neuer Auftrag ' + entwurf.nummer);
}

async function diktatSpeichern(still){
  if(!entwurf) return;
  const felder = document.getElementById('fAnliegen');
  if(felder) felder.value = entwurf.anliegen || '';
  const n = document.getElementById('fNotiz');
  if(n) n.value = entwurf.notiz || '';
  if(!entwurf.anliegen && !entwurf.notiz){ if(!still) melden('Noch nichts diktiert', true); return; }
  try{
    await speichernAuftrag();
    if(!still) melden('Auftrag gespeichert');
  }catch(e){ melden('Speichern fehlgeschlagen: ' + (e.message||e), true); }
}

function hoererBauen(){
  const Erkenner = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new Erkenner();
  r.lang = 'de-DE';
  // Auf Android ist der Dauerbetrieb unzuverlaessig – dort wird nach jeder
  // Aeusserung neu gestartet, das verhindert doppelte und erfundene Saetze.
  r.continuous = !istAndroid;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = e =>{
    // Android liefert fertige Saetze mehrfach aus und faengt dabei wieder
    // vorne an. Deshalb wird mitgezaehlt, was schon geschrieben wurde,
    // statt auf resultIndex zu vertrauen.
    let vorlaeufig = '', fertige = 0;
    for(let i = 0; i < e.results.length; i++){
      if(e.results[i].isFinal){
        fertige++;
        if(fertige > finalsGeschrieben) diktatVerarbeiten(e.results[i][0].transcript);
      }else vorlaeufig += e.results[i][0].transcript;
    }
    if(fertige > finalsGeschrieben) finalsGeschrieben = fertige;
    if(vorlaeufig) diktatAnzeigen(vorlaeufig);
  };
  r.onerror = e =>{
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      hoertZu = false;
      diktatKnopfZeigen('Mikrofon ist gesperrt. In Chrome unter den Seiteneinstellungen dauerhaft erlauben – danach startet das Diktat von selbst.');
    }else if(e.error === 'no-speech'){
      diktatStand('nichts gehört …');
    }
  };
  r.onend = ()=>{
    // Chrome hört nach einer Sprechpause auf – gleich wieder anfangen
    if(hoertZu){ try{ r.start(); }catch(e){} }
    else{ document.getElementById('diktat').classList.remove('hoert'); diktatStand(''); }
  };
  r.onstart = ()=>{
    finalsGeschrieben = 0;              // neue Sitzung, Zaehlung beginnt von vorn
    document.getElementById('diktat').classList.add('hoert');
    diktatStand('hört zu');
    const g = document.getElementById('diktatGross');
    if(g) g.remove();
  };
  return r;
}

function diktatKnopfZeigen(text){
  const kasten = document.getElementById('diktat');
  if(document.getElementById('diktatGross')) return;
  const d = document.createElement('div');
  d.className = 'diktat-gross';
  d.id = 'diktatGross';
  d.innerHTML = '<p class="diktat-hinweis" style="margin-bottom:14px;max-width:20em">' + esc(text) + '</p>'
              + '<button>Zuhören starten</button>';
  d.querySelector('button').onclick = ()=> diktatHoeren();
  kasten.insertBefore(d, kasten.querySelector('.diktat-tasten'));
}

async function diktatWachHalten(){

/* ---------- Bilder in Drive ---------- */
let bilderOrdnerId = null;
const bildCache = new Map();

async function bilderOrdner(){
  if(bilderOrdnerId) return bilderOrdnerId;
  if(!dateiId) await dateiSuchen();
  const meta = await (await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?fields=parents')).json();
  const eltern = (meta.parents && meta.parents[0]) || 'root';
  const q = encodeURIComponent("'"+eltern+"' in parents and name = 'Bilder' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  const j = await (await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)')).json();
  if(j.files && j.files.length){ bilderOrdnerId = j.files[0].id; }
  else{
    const r = await api('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:'Bilder', mimeType:'application/vnd.google-apps.folder', parents:[eltern]})});
    bilderOrdnerId = (await r.json()).id;
  }
  // Kennung in der gemeinsamen Datei hinterlegen, damit das PC-Tool denselben Ordner nutzt
  if(daten.settings && daten.settings.bilderOrdner !== bilderOrdnerId) daten.settings.bilderOrdner = bilderOrdnerId;
  return bilderOrdnerId;
}
function bildName(nummer, datei){
  const endung = (datei.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const stempel = new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  return (nummer || 'Auftrag') + '_' + stempel + '_' + Math.random().toString(36).slice(2,5) + '.' + endung;
}
async function bildHochladen(datei, nummer){
  const ordner = await bilderOrdner();
  const name = bildName(nummer, datei);
  const r = await api('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, parents:[ordner]})});
  const id = (await r.json()).id;
  await api('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',
    {method:'PATCH', headers:{'Content-Type': datei.type || 'image/jpeg'}, body: datei});
  return {name, id};
}
async function bildId(b){
  if(b.id) return b.id;
  const ordner = await bilderOrdner();
  const q = encodeURIComponent("'"+ordner+"' in parents and name = '"+String(b.name).replace(/'/g,"\\'")+"' and trashed = false");
  const j = await (await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)')).json();
  if(!j.files || !j.files.length) throw new Error('Bild nicht in Drive gefunden: ' + b.name);
  b.id = j.files[0].id;
  return b.id;
}
async function bildUrl(b){
  const schluessel = b.id || b.name;
  if(bildCache.has(schluessel)) return bildCache.get(schluessel);
  const id = await bildId(b);
  const r = await api('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
  const url = URL.createObjectURL(await r.blob());
  bildCache.set(id, url); bildCache.set(b.name, url);
  return url;
}
async function bildVerwerfen(b){
  try{
    const id = await bildId(b);
    await api('https://www.googleapis.com/drive/v3/files/'+id, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({trashed:true})});
  }catch(e){}
}

function bildDarstellen(){

/* ---------- Kalender ---------- */
const TERMINE = [
  {feld:'termin', uhr:'uhrAnnahme', schl:'annahme', wort:'Annahme'},
  {feld:'fertig', uhr:'uhrFertig',  schl:'fertig',  wort:'Fertigstellung'}
];
function plusTag(iso){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function erinnerungMinuten(start){
  const e = new Date(start); e.setDate(e.getDate()-1); e.setHours(14,0,0,0);
  const m = Math.round((start - e)/60000);
  return Math.min(Math.max(m, 5), 40320);
}
function terminObjekt(a, t){
  const tag = a[t.feld];
  if(!tag) return null;
  const uhr = (a[t.uhr]||'').trim();
  const fzg = [a.fahrzeug?.marke, a.fahrzeug?.modell].filter(Boolean).join(' ') || 'Fahrzeug';
  const zeilen = ['Auftrag ' + (a.nummer||''), a.kunde?.name||'', a.anliegen||'', a.notiz||''];
  if(a.fahrzeug?.kennzeichen) zeilen.splice(2, 0, 'Kennzeichen ' + a.fahrzeug.kennzeichen);
  const ev = {
    summary: t.wort + ': ' + fzg + (a.kunde?.name ? ' – ' + a.kunde.name : ''),
    description: zeilen.filter(Boolean).join('\n')
  };
  let start;
  if(uhr){
    const [h,m] = uhr.split(':').map(Number);
    start = new Date(tag+'T00:00:00'); start.setHours(h||0, m||0, 0, 0);
    const ende = new Date(start.getTime() + 60*60000);
    const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
    ev.start = {dateTime: iso(start), timeZone: ZEITZONE};
    ev.end   = {dateTime: iso(ende),  timeZone: ZEITZONE};
  }else{
    start = new Date(tag+'T00:00:00');
    ev.start = {date: tag};
    ev.end   = {date: plusTag(tag)};
  }
  const erinnerungen = [{method:'popup', minutes: erinnerungMinuten(start)}];
  if(uhr) erinnerungen.push({method:'popup', minutes: 60});   // eine Stunde vorher
  ev.reminders = {useDefault:false, overrides: erinnerungen};
  return ev;
}
async function kalenderAbgleich(a){
  const bilanz = {neu:0, geaendert:0, geloescht:0};
  if(!cfg.kalender) return bilanz;
  a.kalender = a.kalender || {};
  const basis = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  for(const t of TERMINE){
    const ev = terminObjekt(a, t);
    const id = a.kalender[t.schl];
    try{
      if(!ev){
        if(id){ await api(basis+'/'+id, {method:'DELETE'}); delete a.kalender[t.schl]; bilanz.geloescht++; }
        continue;
      }
      if(id){
        const r = await api(basis+'/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ev)});
        await r.json(); bilanz.geaendert++;
      }else{
        const r = await api(basis+'?sendUpdates=none', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ev)});
        a.kalender[t.schl] = (await r.json()).id; bilanz.neu++;
      }
    }catch(e){
      if(id && /404|410/.test(e.message)){ delete a.kalender[t.schl]; continue; }
      throw new Error('Kalender: ' + e.message);
    }
  }
  return bilanz;
}
async function kalenderEntfernen(a){
  const bilanz = {geloescht:0, offen:0};
  if(!a || !a.kalender) return bilanz;
  const basis = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  for(const t of TERMINE){
    const id = a.kalender[t.schl];
    if(!id) continue;
    try{
      await api(basis+'/'+id, {method:'DELETE'});
      delete a.kalender[t.schl]; bilanz.geloescht++;
    }catch(e){
      if(/404|410/.test(e.message)){ delete a.kalender[t.schl]; }   // war schon weg
      else bilanz.offen++;
    }
  }
  return bilanz;
}

function kundeTeile(k){
  k = k || {};
  if(k.vorname || k.nachname) return {vorname: k.vorname||'', nachname: k.nachname||''};
  // Altbestand: Gesamtname aufteilen, letztes Wort gilt als Nachname
  const teile = String(k.name||'').trim().split(/\s+/).filter(Boolean);
  if(!teile.length) return {vorname:'', nachname:''};
  if(teile.length === 1) return {vorname:'', nachname: teile[0]};
  return {vorname: teile.slice(0,-1).join(' '), nachname: teile[teile.length-1]};
}
function kundeName(k){
  const t = kundeTeile(k);
  return [t.vorname, t.nachname].filter(Boolean).join(' ') || (k && k.name) || '';

  const i = document.getElementById('blattInhalt');
  i.querySelectorAll('[data-st]').forEach(b=> b.onclick = ()=>{ uebernehmen(); entwurf.status = b.dataset.st; zeichne(); });
  i.querySelectorAll('[data-plus]').forEach(b=> b.onclick = ()=>{
    uebernehmen();
    if(b.dataset.plus==='arbeit') entwurf.arbeit.push({bez:'',einheit:'aw',aw:'',satz:daten.settings.aw});
    else entwurf.teile.push({bez:'',einheit:'stk',menge:1,preis:''});
    zeichne();
  });
  i.querySelectorAll('[data-weg]').forEach(b=> b.onclick = ()=>{
    uebernehmen(); const [art,n] = b.dataset.weg.split(':'); entwurf[art].splice(+n,1); zeichne();
  });
  i.querySelectorAll('.pos .feld').forEach(f=> f.onchange = ()=>{ uebernehmen(); zeichne(); });
  [['fTermin','fUhrAnnahme'],['fFertig','fUhrFertig']].forEach(([dId,uId])=>{
    const d = document.getElementById(dId), u = document.getElementById(uId);
    if(!d || !u) return;
    const pruefen = ()=>{
      const leer = !d.value;
      if(leer) u.value = '';
      u.disabled = leer;
      u.placeholder = leer ? 'ohne Datum' : '';
    };
    d.onchange = ()=>{ pruefen(); if(!d.value) melden('Datum entfernt – der Kalendereintrag verschwindet beim Speichern.'); };
    pruefen();
  });
  bilderZeichnen();
  document.getElementById('btnBild').onclick = ()=> document.getElementById('bildWahl').click();
  document.getElementById('btnFoto').onclick = ()=> document.getElementById('fotoWahl').click();
  document.getElementById('fotoWahl').onchange = e => bilderAnhaengen([...e.target.files], e.target);
  document.getElementById('bildWahl').onchange = e => bilderAnhaengen([...e.target.files], e.target);
  document.getElementById('btnSchein').onclick = ()=> scheinBildWaehlen();
  document.querySelectorAll('[data-diktat]').forEach(b => b.onclick = ()=>{ uebernehmen(); diktatOeffnen(b.dataset.diktat); });
  const pm = document.getElementById('fPreisModus');
  if(pm) pm.onchange = ()=>{ uebernehmen(); zeichne(); };
  document.getElementById('btnSpeichern').onclick = speichernAuftrag;
  const d = document.getElementById('btnLoeschen');
  if(d) d.onclick = async ()=>{
    if(!confirm('Auftrag '+entwurf.nummer+' löschen? Vorhandene Kalendereinträge werden mitgelöscht.')) return;
    const weg = daten.auftraege.find(x=>x.id===aktuelleId);
    const nr = entwurf.nummer;
    daten.auftraege = daten.auftraege.filter(x=>x.id!==aktuelleId);
    zurueck(); render();
    let bilanz = {geloescht:0, offen:0};
    try{ zustand('laeuft','Kalender …'); bilanz = await kalenderEntfernen(weg); }catch(e){ bilanz.offen++; }
    await sichern();
    if(bilanz.offen) melden('Auftrag '+nr+' gelöscht, aber '+bilanz.offen+' Kalendereintrag/-einträge konnten nicht entfernt werden – bitte im Kalender prüfen.', true);
    else melden('Auftrag '+nr+' gelöscht'+(bilanz.geloescht?' samt '+bilanz.geloescht+(bilanz.geloescht>1?' Kalendereinträgen':' Kalendereintrag'):''));
  };
}
async function bilderZeichnen(){
  const streifen = document.getElementById('bildStreifen');
  if(!streifen || !entwurf) return;
  streifen.querySelectorAll('[data-bweg]').forEach(b => b.onclick = async ev =>{
    ev.stopPropagation();
    const i = +b.dataset.bweg, bild = entwurf.bilder[i];
    if(!confirm('Bild entfernen? Es wandert in den Drive-Papierkorb.')) return;
    uebernehmen();
    entwurf.bilder.splice(i,1);
    zeichne();
    await bildVerwerfen(bild);
  });
  for(const kachel of streifen.querySelectorAll('.bildkachel')){
    const b = entwurf.bilder[+kachel.dataset.b];
    if(!b) continue;
    try{
      const url = await bildUrl(b);
      const img = document.createElement('img');
      img.src = url; img.alt = b.name;
      kachel.querySelector('.lade')?.remove();
      kachel.insertBefore(img, kachel.firstChild);
      img.onclick = ()=> bildAnzeigen(url, b.name);
    }catch(e){
      const t = kachel.querySelector('.lade');
      if(t) t.textContent = 'nicht gefunden';
    }
  }
}

function uebernehmen(){
  const v = id => (document.getElementById(id)||{}).value || '';
  entwurf.termin = v('fTermin');
  entwurf.uhrAnnahme = entwurf.termin ? v('fUhrAnnahme') : '';
  entwurf.fertig = v('fFertig');
  entwurf.uhrFertig = entwurf.fertig ? v('fUhrFertig') : '';
  const kv = v('kVor').trim(), kn = v('kNach').trim();
  entwurf.kunde = {vorname:kv, nachname:kn, name:[kv,kn].filter(Boolean).join(' '),
                   telefon:v('kTel'), email:v('kMail'), strasse:v('kStr'), plz:v('kPlz'), ort:v('kOrt')};
  entwurf.preisModus = v('fPreisModus') || 'netto';
  entwurf.fahrzeug = {marke:v('fMarke'), modell:v('fModell'), kennzeichen:v('fKennz').toUpperCase(),
                      fin:v('fFin').toUpperCase(), km:v('fKm'), erstzulassung:v('fErstzul')};
  entwurf.anliegen = v('fAnliegen'); entwurf.notiz = v('fNotiz');
  document.querySelectorAll('#blattInhalt .pos').forEach(p=>{
    const art = p.dataset.art, n = +p.dataset.i;
    p.querySelectorAll('.feld').forEach(f=> entwurf[art][n][f.dataset.f] = f.value);
    const zeile = entwurf[art][n];
    if(zeile.einheit === 'pauschal'){ if(art === 'arbeit') zeile.aw = 1; else zeile.menge = 1; }
  });
}
async function speichernAuftrag(){
  uebernehmen();
  entwurf.arbeit = entwurf.arbeit.filter(p=>p.bez||z(p.aw));
  entwurf.teile = entwurf.teile.filter(p=>p.bez||z(p.preis));
  if(!entwurf.kunde.name && !entwurf.fahrzeug.kennzeichen && !entwurf.anliegen){
    melden('Mindestens Kunde, Kennzeichen oder Auftragsumfang ausfüllen.', true); return;
  }
  const i = daten.auftraege.findIndex(a=>a.id===entwurf.id);
  if(i>=0) daten.auftraege[i] = entwurf; else daten.auftraege.unshift(entwurf);
  const a = entwurf;
  zurueck(); render();
  let hinweis = '', bilanz = null;
  try{ zustand('laeuft','Kalender …'); bilanz = await kalenderAbgleich(a); }
  catch(e){ hinweis = e.message; }
  await sichern();
  if(hinweis) melden(hinweis + ' – Auftrag ist gespeichert, Termin nicht eingetragen.', true);
  else if(bilanz && bilanz.geloescht) melden('Gespeichert – ' + bilanz.geloescht + (bilanz.geloescht>1?' Kalendereinträge':' Kalendereintrag') + ' gelöscht');
}

const APPVERSION = '2026-08-19 / 43';
/* ---------- Konto & Einrichtung ---------- */
function setup(){
  aktuelleId = null;
  document.getElementById('blattTitel').textContent = 'Konto & Datei';
  document.getElementById('blattInhalt').innerHTML = `
  <fieldset><legend>Google-Verbindung</legend>
    <p class="notiz">Die App liest und schreibt genau die JSON-Datei, die auch das Werkstatt-Tool am PC verwendet.
      Die Client-ID stammt aus Deinem Google-Cloud-Projekt (siehe Einrichtungsanleitung).</p>
    <label for="cId">OAuth Client-ID</label>
    <input class="feld" id="cId" placeholder="…apps.googleusercontent.com" value="${esc(cfg.clientId)}">
    <label for="cDatei">Dateiname in Drive</label>
    <input class="feld" id="cDatei" value="${esc(cfg.dateiName)}">
    <label for="cKonto">Google-Konto</label>
    <input class="feld" id="cKonto" type="email" placeholder="wird beim ersten Anmelden übernommen" value="${esc(cfg.konto)}">
    <p class="notiz">Steht hier eine Adresse, meldet sich die App direkt damit an – die Kontoauswahl entfällt. Zum Kontowechsel Feld leeren.</p>
    <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--tinte);margin:4px 0 12px">
      <input type="checkbox" id="cKal" ${cfg.kalender?'checked':''}> Termine im Google Kalender führen
    </label>
    <button class="k2" id="btnVerbinden" style="margin-top:4px">Mit Google verbinden</button>
  </fieldset>
  <fieldset><legend>Betrieb</legend>
    <p class="notiz">Erscheint auf dem Auftragszettel am Rechner. Wird zusammen mit den Aufträgen in Drive gespeichert.</p>
    <label for="cBetrieb">Betrieb, Anschrift, Kontakt</label>
    <textarea class="feld" id="cBetrieb" rows="4">${esc(daten.settings.betrieb || VORGABE.betrieb)}</textarea>
    <label for="cStd">Arbeitswert AW (€)</label>
    <input class="feld" id="cStd" type="number" step="0.05" value="${esc(daten.settings.aw !== undefined ? daten.settings.aw : 9.60)}">
    <p class="notiz">1 AW = ein Zehntel Stunde (6 Minuten). Bei ${eur(z(daten.settings.aw||0))} je AW sind das ${eur(z(daten.settings.aw||0)*10)} je Stunde.</p>
    <label for="cUst">Umsatzsteuer</label>
    <select class="feld" id="cUst">
      <option value="0" ${!daten.settings.kleinunternehmer?'selected':''}>Regelbesteuerung – USt ausweisen</option>
      <option value="1" ${daten.settings.kleinunternehmer?'selected':''}>Kleinunternehmer § 19 UStG</option>
    </select>
    <label class="notiz" for="sPreisModus">Preiseingabe für neue Aufträge</label>
    <select class="feld" id="sPreisModus">
      <option value="netto" ${(daten.settings.preisModus||'netto')==='netto'?'selected':''}>Netto – zzgl. USt</option>
      <option value="brutto" ${daten.settings.preisModus==='brutto'?'selected':''}>Brutto – inkl. USt</option>
    </select>
    <button class="k2" id="btnBetriebSpeichern">Betriebsdaten speichern</button>
  </fieldset>

  <fieldset><legend>Texterkennung</legend>
    <p class="notiz">Womit der Fahrzeugschein gelesen wird. Die Drive-Erkennung ist deutlich treffsicherer und kostet nichts extra; ohne Netz weicht sie von selbst auf den Browser aus.</p>
    <select class="feld" id="cSchein">
      <option value="drive" ${scheinWeg()==='drive'?'selected':''}>Google Drive – treffsicher, braucht Netz</option>
      <option value="browser" ${scheinWeg()==='browser'?'selected':''}>Im Browser – ohne Datenversand, ungenauer</option>
    </select>
  </fieldset>
  <fieldset><legend>Status</legend>
    <p class="notiz">${dateiId ? 'Verbunden mit <code>'+esc(cfg.dateiName)+'</code>. Aufträge: '+daten.auftraege.length
      : 'Noch keine Datei verbunden.'}</p>
    <p class="notiz">${tokenGueltig()
      ? 'Angemeldet, gültig bis ' + new Date(tokenBis).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' Uhr. Danach meldet sich die App im Hintergrund selbst neu an.'
      : 'Zurzeit nicht angemeldet.'}</p>
    <p class="notiz">App-Fassung <b>${APPVERSION}</b></p>
    <button class="k2" id="btnNeuLaden">Vom Drive neu laden</button>
    <button class="k2" id="btnAppFrisch" style="margin-top:8px">App aktualisieren</button>
    <button class="k2" id="btnAbmelden" style="margin-top:8px">Abmelden</button>
  </fieldset>
  <div class="aktionen"><button class="k2 k2-haupt" id="btnFertig">Fertig</button></div>`;
  document.getElementById('cSchein').onchange = e =>{
    lsSet('werkstatt-scheinweg', e.target.value);
    melden(e.target.value === 'drive' ? 'Fahrzeugscheine werden über Drive gelesen' : 'Fahrzeugscheine werden im Browser gelesen');
  };
  document.getElementById('cKal').onchange = e =>{ cfg.kalender = e.target.checked; lsSet('werkstatt-cfg', JSON.stringify(cfg)); };
  document.getElementById('btnVerbinden').onclick = async ()=>{
    cfg.clientId = document.getElementById('cId').value.trim();
    cfg.dateiName = document.getElementById('cDatei').value.trim() || 'werkstattauftraege-daten.json';
    cfg.konto = document.getElementById('cKonto').value.trim();
    lsSet('werkstatt-cfg', JSON.stringify(cfg));
    dateiId = null; tokenVerwerfen();
    try{ await anmelden(true); await holen(); zurueck(); melden('Verbunden'); }
    catch(e){ melden(e.message, true); }
  };
  document.getElementById('btnBetriebSpeichern').onclick = async ()=>{
    daten.settings.betrieb = document.getElementById('cBetrieb').value;
    daten.settings.aw = parseFloat(String(document.getElementById('cStd').value).replace(',','.')) || VORGABE.aw;
    daten.settings.stundensatz = Math.round(daten.settings.aw * 10 * 100) / 100;
    daten.settings.kleinunternehmer = document.getElementById('cUst').value === '1';
    await sichern(); render();
  };
  document.getElementById('btnAppFrisch').onclick = appAuffrischen;
  document.getElementById('btnNeuLaden').onclick = async ()=>{ dateiId = null; await holen(); zurueck(); };
  document.getElementById('btnAbmelden').onclick = ()=>{
    tokenVerwerfen(); dateiId = null;
    zustand('aus','Abgemeldet');
    melden('Abgemeldet – Token entfernt, Konto bleibt für die nächste Anmeldung hinterlegt.'); setup();
  };
  document.getElementById('btnFertig').onclick = ()=>{
    cfg.clientId = document.getElementById('cId').value.trim();
    cfg.dateiName = document.getElementById('cDatei').value.trim() || cfg.dateiName;
    cfg.konto = document.getElementById('cKonto').value.trim();
    lsSet('werkstatt-cfg', JSON.stringify(cfg)); zurueck();
  };
  document.getElementById('blatt').hidden = false;
  document.body.style.overflow = 'hidden';
}

/* ---------- Start ---------- */
document.getElementById('btnNeu').onclick = ()=> editor(null);
document.getElementById('btnZurueck').onclick = zurueck;
document.getElementById('bildseiteZu').onclick = bildSeiteZu;
document.getElementById('bildGroesser').onclick = ()=>{ bildZoom = Math.min(6, bildZoom * 1.4); bildDarstellen(); };
document.getElementById('bildKleiner').onclick = ()=>{ bildZoom = Math.max(0.25, bildZoom / 1.4); bildDarstellen(); };
document.getElementById('bildDrehen').onclick = ()=>{ bildDrehung = (bildDrehung + 90) % 360; bildDarstellen(); };
document.getElementById('bildHoehe').onclick = e =>{
  const seite = document.getElementById('bildseite');
  const gross = seite.classList.toggle('gross');
  e.target.textContent = gross ? 'Kleiner' : 'Größer';
};
document.getElementById('btnSetup').onclick = setup;
document.getElementById('btnSync').onclick = ()=> holen();
document.getElementById('btnJetzt').onclick = ()=> holen();
document.getElementById('suche').oninput = e =>{ suchtext = e.target.value; renderListe(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && dateiId && document.getElementById('blatt').hidden) holen(true); });

(function start(){
  try{ const c = JSON.parse(lsGet('werkstatt-cfg')||'null'); if(c) cfg = Object.assign(cfg,c); }catch(e){}
  try{ const c = JSON.parse(lsGet('werkstatt-cache')||'null'); if(c && c.auftraege){ daten = c; daten.settings = Object.assign({},VORGABE,c.settings||{}); migriereAW(daten); } }catch(e){}
  render();
  if(!cfg.clientId){ zustand('aus','Einrichtung nötig – auf Konto tippen'); return; }
  if(tokenHolenAusSpeicher()){ zustand('laeuft','Angemeldet – lade …'); holen(true); return; }
  zustand('','Bereit');
  const warte = setInterval(()=>{ if(gisBereit()){ clearInterval(warte); holen(true); } }, 300);
  setTimeout(()=>clearInterval(warte), 15000);
})();
setInterval(()=>{
  if(document.hidden || !cfg.clientId || !gisBereit()) return;
  if(tokenBis && Date.now() > tokenBis - 10*60*1000) anmelden(false).catch(()=>{});
}, 4*60*1000);

document.getElementById('diktatFertig').onclick = diktatUebernehmen;
document.getElementById('diktatAus').onclick = diktatBeenden;

// Direkt ins Diktat starten, wenn die App über das Diktat-Symbol geöffnet wurde
if(/[?&]diktat=1/.test(location.search)){
  setTimeout(()=>{ editor(null); diktatOeffnen('anliegen'); }, 400);
}

/* ---------- Aktualisierung der App ---------- */
let neuGeladen = false;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg =>{
    reg.update();                                   // beim Start nachsehen
    setInterval(()=> reg.update(), 60*60*1000);      // und stündlich
  }).catch(()=>{});
  // Übernimmt eine neue Fassung, wird einmal neu geladen
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(neuGeladen) return;
    neuGeladen = true;
    location.reload();
  });
}

async function appAuffrischen(){
  melden('Suche nach einer neuen Fassung …');
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if(window.caches){
      const namen = await caches.keys();
      await Promise.all(namen.map(n => caches.delete(n)));
    }
  }catch(e){}
  location.replace(location.pathname + '?frisch=' + Date.now());
}
</script>
