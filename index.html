<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Werkstattaufträge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --zink:#E7EBEE; --blech:#FFFFFF; --tinte:#12171C; --stahl:#5C6772;
    --kante:#C9D2D9; --oel:#B4690E; --signal:#D7263D; --gruen:#2F7A4C;
    --radius:3px;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain}
  body{background:var(--zink);color:var(--tinte);font-family:var(--body);font-size:15px;line-height:1.45;
       padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  :focus-visible{outline:2px solid var(--oel);outline-offset:2px}

  .kopf{position:sticky;top:0;z-index:20;background:var(--tinte);color:#fff;
        padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:9px;
        border-bottom:3px solid var(--oel)}
  .kopf h1{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.13em;
           text-transform:uppercase;margin:0;flex:1}
  .knopf{background:transparent;color:#fff;border:1px solid #46525E;border-radius:var(--radius);
         padding:6px 10px;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .knopf-voll{background:var(--oel);border-color:var(--oel)}

  .syncleiste{background:#DCE3E8;border-bottom:1px solid var(--kante);padding:6px 14px;
              font-size:12px;color:var(--stahl);display:flex;gap:8px;align-items:center;font-family:var(--mono)}
  .syncleiste .punkt{width:8px;height:8px;border-radius:50%;background:var(--stahl);flex:none}
  .punkt.an{background:var(--gruen)} .punkt.aus{background:var(--signal)} .punkt.laeuft{background:var(--oel)}
  .syncleiste button{margin-left:auto;background:none;border:0;color:var(--oel);font-family:var(--mono);font-size:12px;padding:2px 4px}

  .reiter-zeile{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--zink);
                border-bottom:1px solid var(--kante);position:sticky;z-index:15;-webkit-overflow-scrolling:touch}
  .reiter-zeile::-webkit-scrollbar{display:none}
  .reiter{background:var(--blech);border:1px solid var(--kante);border-radius:20px;padding:6px 13px;
          font-size:13px;color:var(--stahl);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
  .reiter[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff}
  .reiter .n{font-family:var(--mono);font-size:11px;opacity:.75}

  .suchfeld{margin:10px 14px 0;width:calc(100% - 28px);padding:9px 12px;border:1px solid var(--kante);
            border-radius:var(--radius);background:var(--blech)}

  .liste{padding:12px 14px 96px;display:grid;gap:10px}
  .karte{background:var(--blech);border:1px solid var(--kante);border-left:5px solid var(--stahl);
         border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%;display:block;position:relative}
  .karte .nr{font-family:var(--mono);font-size:11px;color:var(--stahl)}
  .karte .haupt{font-family:var(--display);font-size:19px;font-weight:600;margin:2px 0 1px;padding-right:58px;
                letter-spacing:.02em}
  .karte .neben{font-size:13px;color:var(--stahl)}
  .karte .anliegen{margin-top:8px;padding-top:8px;border-top:1px dashed var(--kante);font-size:13.5px;
                   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .karte .fuss{margin-top:8px;display:flex;justify-content:space-between;font-family:var(--mono);
               font-size:12px;color:var(--stahl)}
  .karte .summe{color:var(--tinte);font-size:14px}
  .kennz{display:inline-block;font-family:var(--mono);font-weight:600;font-size:11px;border:1.5px solid var(--tinte);
         border-left:6px solid #1E4DA8;border-radius:3px;padding:1px 5px 1px 3px;background:#fff}
  .plakette{position:absolute;top:11px;right:12px;width:46px;height:46px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;
            text-transform:uppercase;color:#1a1a1a;border:2px solid rgba(18,23,28,.55);font-weight:600}
  .s-angenommen{background:#F2A03D} .s-arbeit{background:#8FD0F0} .s-teile{background:#F4E04D}
  .s-fertig{background:#7FCB8F} .s-abgeholt{background:#DCD9D2;color:#6A6A6A}
  .k-angenommen{border-left-color:#F2A03D} .k-arbeit{border-left-color:#3FA3D8} .k-teile{border-left-color:#D9BF1E}
  .k-fertig{border-left-color:var(--gruen)} .k-abgeholt{border-left-color:#B9B9B9;opacity:.72}

  .neu{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;
       background:var(--oel);color:#fff;border:0;border-radius:28px;padding:14px 20px;
       font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;font-size:14px;
       box-shadow:0 4px 14px rgba(18,23,28,.3)}

  .leer{text-align:center;color:var(--stahl);padding:50px 24px}
  .leer h2{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:16px;color:var(--tinte)}

  .blatt{position:fixed;inset:0;z-index:40;background:var(--blech);overflow-y:auto;display:flex;flex-direction:column}
  .blatt[hidden]{display:none}
  .blatt-kopf{position:sticky;top:0;background:var(--tinte);color:#fff;z-index:2;
              padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:9px;align-items:center}
  .blatt-kopf .titel{flex:1;font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;font-size:15px}
  .blatt-inhalt{padding:14px;flex:1}
  fieldset{border:0;border-top:1px solid var(--kante);margin:0;padding:13px 0 6px}
  legend{font-family:var(--display);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--oel)}
  label{display:block;font-size:12px;color:var(--stahl);margin-bottom:3px}
  .feld{width:100%;padding:10px;border:1px solid var(--kante);border-radius:var(--radius);
        background:#FBFCFD;margin-bottom:10px}
  textarea.feld{min-height:66px;resize:vertical}
  .zeile{display:grid;gap:10px;grid-template-columns:1fr 1fr}

  .statuswahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:6px;margin-bottom:12px}
  .statuswahl button{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);padding:9px 4px;
                     font-size:12px;color:var(--stahl)}
  .statuswahl button[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff}

  .pos{display:grid;grid-template-columns:1fr 58px 70px 34px;gap:6px;margin-bottom:6px}
  .pos .feld{margin-bottom:0;padding:9px 7px}
  .pos-kopf{display:grid;grid-template-columns:1fr 58px 70px 34px;gap:6px;font-size:11px;color:var(--stahl);
            text-transform:uppercase;margin-bottom:4px}
  .weg{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);color:var(--stahl)}
  .plus{background:#fff;border:1px dashed var(--kante);border-radius:var(--radius);padding:8px 12px;
        color:var(--stahl);font-size:13px}

  .summen{background:#F4F7F9;border:1px solid var(--kante);border-radius:var(--radius);padding:11px 13px;
          margin-top:8px;font-family:var(--mono);font-size:13px}
  .summen div{display:flex;justify-content:space-between;padding:2px 0}
  .summen .brutto{border-top:2px solid var(--tinte);margin-top:6px;padding-top:6px;font-size:16px;
                  font-family:var(--display);font-weight:600}

  .aktionen{position:sticky;bottom:0;background:var(--blech);border-top:1px solid var(--kante);
            padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .k2{border:1px solid var(--kante);background:#fff;border-radius:var(--radius);padding:11px 14px;
      font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;flex:1}
  .k2-haupt{background:var(--tinte);border-color:var(--tinte);color:#fff}
  .k2-loeschen{flex:none;color:var(--stahl)}
  .k2-loeschen:hover{color:var(--signal);border-color:var(--signal)}

  .bilder{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .bildkachel{position:relative;width:88px;height:88px;border:1px solid var(--kante);border-radius:var(--radius);
              overflow:hidden;background:#F1F4F6;display:flex;align-items:center;justify-content:center}
  .bildkachel img{width:100%;height:100%;object-fit:cover;display:block}
  .bildkachel .lade{font-size:10px;color:var(--stahl);text-align:center;padding:4px}
  .bildkachel .weg{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;
                   border:0;background:rgba(18,23,28,.72);color:#fff;font-size:12px;line-height:1;padding:0}
  .bildvoll{position:fixed;inset:0;z-index:70;background:rgba(10,13,16,.94);display:flex;
            align-items:center;justify-content:center;padding:12px}
  .bildvoll[hidden]{display:none}
  .bildvoll img{max-width:100%;max-height:88vh;object-fit:contain}
  .bildvoll button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
                   background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);
                   border-radius:var(--radius);padding:8px 13px}

  .scheinbox{position:fixed;inset:0;z-index:75;background:rgba(10,13,16,.6);display:flex;
             align-items:center;justify-content:center;padding:14px}
  .scheinbox[hidden]{display:none}
  .scheinblatt{background:var(--blech);border-radius:var(--radius);max-width:520px;width:100%;
               max-height:92vh;overflow-y:auto;padding:16px;border:1px solid var(--kante)}
  .scheinblatt h3{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;
                  font-size:14px;margin:0 0 4px}
  .scheinzeile{display:flex;gap:9px;align-items:center;margin-bottom:8px}
  .scheinzeile input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--kante);
                                border-radius:var(--radius);background:#FBFCFD}
  .scheinzeile .bez{width:104px;font-size:12px;color:var(--stahl);flex:none}
  .fortschritt{height:6px;background:#E3E9ED;border-radius:3px;overflow:hidden;margin:10px 0}
  .fortschritt div{height:100%;background:var(--oel);width:0%}
  .meldung{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
           z-index:60;background:var(--tinte);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;
           max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .meldung[hidden]{display:none}
  .meldung.fehler{background:var(--signal)}
  .notiz{font-size:12.5px;color:var(--stahl);margin:0 0 10px}
  code{font-family:var(--mono);font-size:12px;background:#F1F4F6;padding:1px 4px;border-radius:2px;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="kopf">
  <h1>Aufträge</h1>
  <button class="knopf" id="btnSync">Sync</button>
  <button class="knopf" id="btnSetup">Konto</button>
</header>

<div class="syncleiste"><span class="punkt" id="punkt"></span><span id="syncText">Nicht verbunden</span>
  <button id="btnJetzt">Aktualisieren</button></div>

<div class="reiter-zeile" id="reiter"></div>
<input class="suchfeld" id="suche" type="search" placeholder="Kunde, Kennzeichen, Modell …">
<main class="liste" id="liste"></main>
<button class="neu" id="btnNeu">+ Auftrag</button>

<section class="blatt" id="blatt" hidden>
  <div class="blatt-kopf"><span class="titel" id="blattTitel">Auftrag</span>
    <button class="knopf" id="btnZurueck">Zurück</button></div>
  <div class="blatt-inhalt" id="blattInhalt"></div>
</section>

<div class="bildvoll" id="bildvoll" hidden><img id="bildvollImg" alt="Auftragsbild"><button id="bildvollZu">Schließen</button></div>
<div class="scheinbox" id="scheinbox" hidden><div class="scheinblatt" id="scheinblatt"></div></div>
<div class="meldung" id="meldung" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const STATUS = [
  {id:'angenommen', label:'Angenommen', kurz:'Ang'},
  {id:'arbeit',     label:'In Arbeit',  kurz:'Arb'},
  {id:'teile',      label:'Auf Teile',  kurz:'Teile'},
  {id:'fertig',     label:'Fertig',     kurz:'Fertig'},
  {id:'abgeholt',   label:'Abgeholt',   kurz:'Abg'}
];
const VORGABE = {stundensatz:96, kleinunternehmer:false, mwst:19, betrieb:'UCL Motorrad\nBergheimer Straße 26\n88677 Markdorf'};
const SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events';
const ZEITZONE = 'Europe/Berlin';

let cfg = {clientId:'', dateiName:'werkstattauftraege-daten.json', kalender:true, konto:''};
let daten = {version:1, settings:Object.assign({},VORGABE), auftraege:[]};
let dateiId = null, standDrive = null, token = null, tokenBis = 0, tokenClient = null;
let filter = 'offen', suchtext = '', entwurf = null, aktuelleId = null, syncLaeuft = false;

/* ---------- Werkzeug ---------- */
const z = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
const eur = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const datum = s => s ? new Date(s+'T00:00:00').toLocaleDateString('de-DE') : '–';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function summen(a){
  const arbeit = (a.arbeit||[]).reduce((s,p)=>s+z(p.std)*z(p.satz),0);
  const teile  = (a.teile||[]).reduce((s,p)=>s+z(p.menge)*z(p.preis),0);
  const netto = arbeit+teile;
  const satz = daten.settings.kleinunternehmer ? 0 : z(daten.settings.mwst);
  const steuer = netto*satz/100;
  return {arbeit,teile,netto,steuer,brutto:netto+steuer,satz};
}
function neueNummer(){
  const j = new Date().getFullYear();
  const max = daten.auftraege.filter(a=>(a.nummer||'').startsWith(j+'-'))
    .reduce((m,a)=>Math.max(m,parseInt((a.nummer||'').split('-')[1]||0,10)),0);
  return j+'-'+String(max+1).padStart(3,'0');
}
let meldeLauf=null;
function melden(t,fehler){
  const e=document.getElementById('meldung');
  e.textContent=t; e.className='meldung'+(fehler?' fehler':''); e.hidden=false;
  clearTimeout(meldeLauf); meldeLauf=setTimeout(()=>e.hidden=true, fehler?6000:2000);
}
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function zustand(art, text){
  document.getElementById('punkt').className = 'punkt '+art;
  document.getElementById('syncText').textContent = text;
}

/* ---------- Anmeldung & Drive ---------- */
function gisBereit(){ return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2; }
function tokenGueltig(){ return !!token && Date.now() < tokenBis; }
function tokenMerken(t, sekunden){
  token = t;
  tokenBis = Date.now() + (Math.max(60, sekunden||3600) - 90) * 1000;
  lsSet('werkstatt-token', JSON.stringify({t: token, bis: tokenBis}));
}
function tokenHolenAusSpeicher(){
  try{
    const g = JSON.parse(lsGet('werkstatt-token') || 'null');
    if(g && g.t && Date.now() < g.bis){ token = g.t; tokenBis = g.bis; return true; }
  }catch(e){}
  return false;
}
function tokenVerwerfen(){
  token = null; tokenBis = 0;
  try{ localStorage.removeItem('werkstatt-token'); }catch(e){}
}
function anmelden(interaktiv){
  if(!interaktiv && tokenGueltig()) return Promise.resolve(token);
  return new Promise((ok,fehl)=>{
    if(!cfg.clientId) return fehl(new Error('Keine Client-ID hinterlegt'));
    if(!gisBereit()) return fehl(new Error('Google-Anmeldung nicht geladen – Internetverbindung prüfen'));
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId, scope: SCOPE,
      callback: r => r.access_token ? (tokenMerken(r.access_token, r.expires_in), ok(token))
                                    : fehl(new Error('Anmeldung abgebrochen')),
      error_callback: e => fehl(new Error(e && e.type === 'popup_closed' ? 'Anmeldefenster geschlossen' : 'Anmeldung fehlgeschlagen'))
    });
    const wunsch = {prompt: interaktiv ? 'consent' : ''};
    if(cfg.konto) wunsch.hint = cfg.konto;
    tokenClient.requestAccessToken(wunsch);
  });
}
async function api(url, opt){
  opt = opt || {};
  if(!tokenGueltig()) await anmelden(false);
  const ruf = () => fetch(url, Object.assign({}, opt, {
    headers: Object.assign({Authorization:'Bearer '+token}, opt.headers||{})
  }));
  let r = await ruf();
  if(r.status === 401){
    tokenVerwerfen();
    try{ await anmelden(false); }
    catch(e){ throw new Error('Anmeldung abgelaufen – bitte unter Konto neu verbinden'); }
    r = await ruf();
  }
  if(!r.ok){
    let grund = '';
    try{
      const j = await r.clone().json();
      grund = (j.error && (j.error.message || j.error.status)) || '';
    }catch(e){ try{ grund = (await r.clone().text()).slice(0,200); }catch(e2){} }
    throw new Error('Google meldet ' + r.status + (grund ? ': ' + grund : ''));
  }
  return r;
}
async function dateiSuchen(){
  const q = encodeURIComponent("name = '" + cfg.dateiName.replace(/'/g,"\\'") + "' and trashed = false");
  const r = await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)&pageSize=10');
  const j = await r.json();
  if(!j.files || !j.files.length) throw new Error('Datei ' + cfg.dateiName + ' nicht in Drive gefunden');
  dateiId = j.files[0].id;
  return j.files[0];
}
async function standLesen(){
  const r = await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?fields=modifiedTime');
  return (await r.json()).modifiedTime;
}
async function kontoErmitteln(){
  if(cfg.konto) return;
  try{
    const r = await api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)');
    const u = (await r.json()).user;
    if(u && u.emailAddress){ cfg.konto = u.emailAddress; lsSet('werkstatt-cfg', JSON.stringify(cfg)); }
  }catch(e){}
}
async function holen(still){
  if(syncLaeuft) return;
  syncLaeuft = true;
  try{
    zustand('laeuft','Lade …');
    if(!dateiId) await dateiSuchen();
    const r = await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?alt=media');
    const g = await r.json();
    daten = Object.assign({version:1,auftraege:[]}, g);
    daten.settings = Object.assign({}, VORGABE, g.settings||{});
    daten.auftraege = Array.isArray(g.auftraege) ? g.auftraege : [];
    standDrive = await standLesen();
    await kontoErmitteln();
    lsSet('werkstatt-cache', JSON.stringify(daten));
    render();
    zustand('an','Stand ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    if(!still) melden(daten.auftraege.length + ' Aufträge geladen');
  }catch(e){
    zustand('aus', e.message);
    if(!still) melden(e.message, true);
  }finally{ syncLaeuft = false; }
}
async function schreiben(){
  if(!dateiId) await dateiSuchen();
  const jetzt = await standLesen();
  if(standDrive && jetzt !== standDrive){
    if(!confirm('Die Datei wurde zwischenzeitlich auf einem anderen Gerät geändert.\n\nOK = Deine Änderung trotzdem speichern (die andere geht verloren)\nAbbrechen = erst neu laden')){
      await holen(); throw new Error('Nicht gespeichert – bitte Änderung erneut eintragen');
    }
  }
  const r = await api('https://www.googleapis.com/upload/drive/v3/files/'+dateiId+'?uploadType=media',
    {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(daten, null, 2)});
  standDrive = (await r.json()).modifiedTime || await standLesen();
  lsSet('werkstatt-cache', JSON.stringify(daten));
  zustand('an','Gespeichert ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
}
async function sichern(){
  try{ zustand('laeuft','Speichere …'); await schreiben(); melden('In Drive gespeichert'); }
  catch(e){ zustand('aus','Nicht gespeichert'); melden(e.message, true); }
}


/* ---------- Fahrzeugschein auslesen (Texterkennung im Browser) ---------- */
const SCHEINFELDER = [
  {id:'kennzeichen', bez:'Kennzeichen'},
  {id:'fin',         bez:'FIN'},
  {id:'marke',       bez:'Marke'},
  {id:'modell',      bez:'Modell'},
  {id:'kunde',       bez:'Halter'},
  {id:'erstzul',     bez:'Erstzulassung'}
];

function tesseractLaden(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((ok,fehl)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ok;
    s.onerror = ()=> fehl(new Error('Texterkennung konnte nicht geladen werden – Internetverbindung nötig'));
    document.head.appendChild(s);
  });
}

function scheinAuswerten(roh){
  const text = String(roh||'').replace(/\u00a0/g,' ');
  const zeilen = text.split('\n').map(z=>z.trim()).filter(Boolean);
  const treffer = re => { const m = text.match(re); return m ? (m[1]||m[0]).trim() : ''; };

  const nachCode = code => {
    const muster = new RegExp('(?:^|[^A-Za-z0-9.])' + code.replace(/\./g,'\\.') + '[\\s:.)-]*(.*)$');
    for(let i=0;i<zeilen.length;i++){
      const m = zeilen[i].match(muster);
      if(m){
        const rest = (m[1]||'').trim();
        if(rest.length > 1) return rest;
        for(let j=i+1;j<Math.min(i+3,zeilen.length);j++){
          const n = zeilen[j].trim();
          if(n.length > 1 && !/^[A-Z]\.?\d?(\.\d)?$/.test(n)) return n;
        }
      }
    }
    return '';
  };
  const saeubern = s => s.replace(/[|_]+/g,' ').replace(/\s{2,}/g,' ').trim();

  let fin = treffer(/\b([A-HJ-NPR-Z0-9]{17})\b/);
  if(!fin){
    const e = nachCode('E').replace(/[^A-HJ-NPR-Z0-9]/gi,'').toUpperCase();
    if(e.length === 17) fin = e;
  }
  let kennzeichen = treffer(/\b([A-ZÄÖÜ]{1,3})[\s\-–—·]{1,3}([A-ZÄÖÜ]{1,2})[\s\-–—]{0,2}(\d{1,4})\s?([EH])?\b/);
  const km = text.match(/\b([A-ZÄÖÜ]{1,3})[\s\-–—·]{1,3}([A-ZÄÖÜ]{1,2})[\s\-–—]{0,2}(\d{1,4})\s?([EH])?\b/);
  if(km) kennzeichen = km[1] + '-' + km[2] + ' ' + km[3] + (km[4] ? km[4] : '');

  const halter = [nachCode('C.1.2'), nachCode('C.1.1')].map(saeubern).filter(Boolean).join(' ');

  return {
    kennzeichen: (kennzeichen||'').toUpperCase(),
    fin: (fin||'').toUpperCase(),
    marke: saeubern(nachCode('D.1')),
    modell: saeubern(nachCode('D.3') || nachCode('D.2')),
    kunde: halter,
    erstzul: treffer(/\b(\d{2}[.\/]\d{2}[.\/]\d{4})\b/),
    rohtext: text
  };
}

function scheinFortschritt(text, anteil){
  const b = document.getElementById('scheinblatt');
  if(!b) return;
  b.innerHTML = '<h3>Fahrzeugschein wird gelesen</h3>'
    + '<p class="notiz">' + text + '</p>'
    + '<div class="fortschritt"><div style="width:' + Math.round((anteil||0)*100) + '%"></div></div>'
    + '<p class="notiz">Beim ersten Mal lädt die Spracherkennung für Deutsch herunter, das dauert einen Moment.</p>';
  document.getElementById('scheinbox').hidden = false;
}
function scheinSchliessen(){ document.getElementById('scheinbox').hidden = true; }

async function scheinLesen(datei){
  try{
    scheinFortschritt('Texterkennung wird geladen …', 0);
    await tesseractLaden();
    scheinFortschritt('Bild wird gelesen …', 0.05);
    const erg = await Tesseract.recognize(datei, 'deu', {
      logger: m => { if(m.status === 'recognizing text') scheinFortschritt('Bild wird gelesen …', m.progress); }
    });
    scheinPruefen(scheinAuswerten(erg.data && erg.data.text));
  }catch(e){
    scheinSchliessen();
    melden(e.message || 'Texterkennung fehlgeschlagen', true);
  }
}

function scheinPruefen(g){
  const b = document.getElementById('scheinblatt');
  const leer = SCHEINFELDER.every(f => !g[f.id]);
  b.innerHTML = '<h3>Gefundene Angaben</h3>'
    + '<p class="notiz">' + (leer
        ? 'Es ließ sich nichts sicher erkennen. Bei Fotos hilft: gerade von oben, gutes Licht, nur den Schein im Bild.'
        : 'Bitte prüfen und ändern – die Erkennung verwechselt gern 0/O und 1/I. Nur angehakte Felder werden übernommen.')
      + '</p>'
    + SCHEINFELDER.map(f =>
        '<div class="scheinzeile">'
        + '<input type="checkbox" data-an="' + f.id + '" ' + (g[f.id] ? 'checked' : '') + '>'
        + '<span class="bez">' + f.bez + '</span>'
        + '<input type="text" data-w="' + f.id + '" value="' + String(g[f.id]||'').replace(/"/g,'&quot;') + '">'
        + '</div>').join('')
    + '<div class="aktionen" style="position:static;border:0;padding:12px 0 0">'
    + '<button class="k2 k2-haupt" id="scheinUeber">Übernehmen</button>'
    + '<button class="k2" id="scheinAb">Abbrechen</button></div>';

  document.getElementById('scheinAb').onclick = scheinSchliessen;
  document.getElementById('scheinUeber').onclick = ()=>{
    const wert = id => {
      const an = b.querySelector('[data-an="' + id + '"]');
      const w = b.querySelector('[data-w="' + id + '"]');
      return (an && an.checked && w && w.value.trim()) ? w.value.trim() : '';
    };
    uebernehmen();
    entwurf.fahrzeug = entwurf.fahrzeug || {};
    entwurf.kunde = entwurf.kunde || {};
    const kz = wert('kennzeichen'); if(kz) entwurf.fahrzeug.kennzeichen = kz.toUpperCase();
    const fin = wert('fin');        if(fin) entwurf.fahrzeug.fin = fin.toUpperCase();
    const ma = wert('marke');       if(ma) entwurf.fahrzeug.marke = ma;
    const mo = wert('modell');      if(mo) entwurf.fahrzeug.modell = mo;
    const ku = wert('kunde');       if(ku) entwurf.kunde.name = ku;
    const ez = wert('erstzul');
    if(ez && !(entwurf.notiz||'').includes(ez)) entwurf.notiz = ((entwurf.notiz||'') + '\nErstzulassung ' + ez).trim();
    scheinSchliessen();
    zeichne();
    melden('Angaben übernommen – bitte gegenprüfen');
  };
  document.getElementById('scheinbox').hidden = false;
}

/* ---------- Bilder in Drive ---------- */
let bilderOrdnerId = null;
const bildCache = new Map();

async function bilderOrdner(){
  if(bilderOrdnerId) return bilderOrdnerId;
  if(!dateiId) await dateiSuchen();
  const meta = await (await api('https://www.googleapis.com/drive/v3/files/'+dateiId+'?fields=parents')).json();
  const eltern = (meta.parents && meta.parents[0]) || 'root';
  const q = encodeURIComponent("'"+eltern+"' in parents and name = 'Bilder' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  const j = await (await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)')).json();
  if(j.files && j.files.length){ bilderOrdnerId = j.files[0].id; }
  else{
    const r = await api('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:'Bilder', mimeType:'application/vnd.google-apps.folder', parents:[eltern]})});
    bilderOrdnerId = (await r.json()).id;
  }
  return bilderOrdnerId;
}
function bildName(nummer, datei){
  const endung = (datei.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const stempel = new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  return (nummer || 'Auftrag') + '_' + stempel + '_' + Math.random().toString(36).slice(2,5) + '.' + endung;
}
async function bildHochladen(datei, nummer){
  const ordner = await bilderOrdner();
  const name = bildName(nummer, datei);
  const r = await api('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, parents:[ordner]})});
  const id = (await r.json()).id;
  await api('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',
    {method:'PATCH', headers:{'Content-Type': datei.type || 'image/jpeg'}, body: datei});
  return {name, id};
}
async function bildId(b){
  if(b.id) return b.id;
  const ordner = await bilderOrdner();
  const q = encodeURIComponent("'"+ordner+"' in parents and name = '"+String(b.name).replace(/'/g,"\\'")+"' and trashed = false");
  const j = await (await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)')).json();
  if(!j.files || !j.files.length) throw new Error('Bild nicht in Drive gefunden: ' + b.name);
  b.id = j.files[0].id;
  return b.id;
}
async function bildUrl(b){
  const schluessel = b.id || b.name;
  if(bildCache.has(schluessel)) return bildCache.get(schluessel);
  const id = await bildId(b);
  const r = await api('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
  const url = URL.createObjectURL(await r.blob());
  bildCache.set(id, url); bildCache.set(b.name, url);
  return url;
}
async function bildVerwerfen(b){
  try{
    const id = await bildId(b);
    await api('https://www.googleapis.com/drive/v3/files/'+id, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({trashed:true})});
  }catch(e){}
}
function bildAnzeigen(url){
  document.getElementById('bildvollImg').src = url;
  document.getElementById('bildvoll').hidden = false;
}

/* ---------- Kalender ---------- */
const TERMINE = [
  {feld:'termin', uhr:'uhrAnnahme', schl:'annahme', wort:'Annahme'},
  {feld:'fertig', uhr:'uhrFertig',  schl:'fertig',  wort:'Fertigstellung'}
];
function plusTag(iso){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function erinnerungMinuten(start){
  const e = new Date(start); e.setDate(e.getDate()-1); e.setHours(14,0,0,0);
  const m = Math.round((start - e)/60000);
  return Math.min(Math.max(m, 5), 40320);
}
function terminObjekt(a, t){
  const tag = a[t.feld];
  if(!tag) return null;
  const uhr = (a[t.uhr]||'').trim();
  const fzg = [a.fahrzeug?.marke, a.fahrzeug?.modell].filter(Boolean).join(' ') || 'Fahrzeug';
  const zeilen = ['Auftrag ' + (a.nummer||''), a.kunde?.name||'', a.anliegen||'', a.notiz||''];
  if(a.fahrzeug?.kennzeichen) zeilen.splice(2, 0, 'Kennzeichen ' + a.fahrzeug.kennzeichen);
  const ev = {
    summary: t.wort + ': ' + fzg + (a.kunde?.name ? ' – ' + a.kunde.name : ''),
    description: zeilen.filter(Boolean).join('\n')
  };
  let start;
  if(uhr){
    const [h,m] = uhr.split(':').map(Number);
    start = new Date(tag+'T00:00:00'); start.setHours(h||0, m||0, 0, 0);
    const ende = new Date(start.getTime() + 60*60000);
    const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
    ev.start = {dateTime: iso(start), timeZone: ZEITZONE};
    ev.end   = {dateTime: iso(ende),  timeZone: ZEITZONE};
  }else{
    start = new Date(tag+'T00:00:00');
    ev.start = {date: tag};
    ev.end   = {date: plusTag(tag)};
  }
  const erinnerungen = [{method:'popup', minutes: erinnerungMinuten(start)}];
  if(uhr) erinnerungen.push({method:'popup', minutes: 60});   // eine Stunde vorher
  ev.reminders = {useDefault:false, overrides: erinnerungen};
  return ev;
}
async function kalenderAbgleich(a){
  const bilanz = {neu:0, geaendert:0, geloescht:0};
  if(!cfg.kalender) return bilanz;
  a.kalender = a.kalender || {};
  const basis = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  for(const t of TERMINE){
    const ev = terminObjekt(a, t);
    const id = a.kalender[t.schl];
    try{
      if(!ev){
        if(id){ await api(basis+'/'+id, {method:'DELETE'}); delete a.kalender[t.schl]; bilanz.geloescht++; }
        continue;
      }
      if(id){
        const r = await api(basis+'/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ev)});
        await r.json(); bilanz.geaendert++;
      }else{
        const r = await api(basis+'?sendUpdates=none', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ev)});
        a.kalender[t.schl] = (await r.json()).id; bilanz.neu++;
      }
    }catch(e){
      if(id && /404|410/.test(e.message)){ delete a.kalender[t.schl]; continue; }
      throw new Error('Kalender: ' + e.message);
    }
  }
  return bilanz;
}
async function kalenderEntfernen(a){
  const bilanz = {geloescht:0, offen:0};
  if(!a || !a.kalender) return bilanz;
  const basis = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  for(const t of TERMINE){
    const id = a.kalender[t.schl];
    if(!id) continue;
    try{
      await api(basis+'/'+id, {method:'DELETE'});
      delete a.kalender[t.schl]; bilanz.geloescht++;
    }catch(e){
      if(/404|410/.test(e.message)){ delete a.kalender[t.schl]; }   // war schon weg
      else bilanz.offen++;
    }
  }
  return bilanz;
}

function sichtbar(){
  let l = daten.auftraege.slice();
  if(filter === 'offen') l = l.filter(a=>a.status!=='abgeholt');
  else if(filter !== 'alle') l = l.filter(a=>a.status===filter);
  if(suchtext){ const q = suchtext.toLowerCase(); l = l.filter(a=>JSON.stringify(a).toLowerCase().includes(q)); }
  const rang = {angenommen:0,teile:1,arbeit:2,fertig:3,abgeholt:4};
  return l.sort((x,y)=> (rang[x.status]-rang[y.status]) || ((x.fertig||x.termin||'9999').localeCompare(y.fertig||y.termin||'9999')));
}

      ${a.anliegen?`<div class="anliegen">${esc(a.anliegen)}</div>`:''}
      ${(a.bilder&&a.bilder.length)?`<div class="nr" style="margin-top:6px">${a.bilder.length} Bild${a.bilder.length>1?'er':''}</div>`:''}
      <div class="fuss"><span>${[a.termin?'An '+datum(a.termin):'', a.fertig?'Fertig '+datum(a.fertig):''].filter(Boolean).join(' · ') || 'angelegt '+datum(a.angelegt)}</span>

    <p class="notiz" style="margin-top:6px">Die Bilder liegen im Ordner <b>Bilder</b> neben der Auftragsdatei in Drive und sind auch am Rechner sichtbar.</p>
  </fieldset>
  <fieldset><legend>Arbeitszeit</legend>
    <div class="pos-kopf"><span>Schritt</span><span>Std</span><span>€/Std</span><span></span></div>
    ${a.arbeit.map((p,i)=>posZeile('arbeit',p,i)).join('')}
    <button class="plus" data-plus="arbeit">+ Arbeit</button></fieldset>
  <fieldset><legend>Teile</legend>
    <div class="pos-kopf"><span>Bezeichnung</span><span>Anz</span><span>Einzel €</span><span></span></div>
    ${a.teile.map((p,i)=>posZeile('teile',p,i)).join('')}
    <button class="plus" data-plus="teile">+ Teil</button></fieldset>
  <div class="summen">
    <div><span>Arbeit</span><span>${eur(s.arbeit)}</span></div>
    <div><span>Teile</span><span>${eur(s.teile)}</span></div>
    ${s.satz?`<div><span>zzgl. ${s.satz} % USt</span><span>${eur(s.steuer)}</span></div>`:`<div><span>ohne USt (§ 19)</span><span>–</span></div>`}
    <div class="brutto"><span>Gesamt</span><span>${eur(s.brutto)}</span></div>
  </div>
  <div class="aktionen">
    <button class="k2 k2-haupt" id="btnSpeichern">Speichern</button>
    ${aktuelleId?'<button class="k2 k2-loeschen" id="btnLoeschen">Löschen</button>':''}
  </div>`;
  const i = document.getElementById('blattInhalt');
  i.querySelectorAll('[data-st]').forEach(b=> b.onclick = ()=>{ uebernehmen(); entwurf.status = b.dataset.st; zeichne(); });
  i.querySelectorAll('[data-plus]').forEach(b=> b.onclick = ()=>{
    uebernehmen();
    if(b.dataset.plus==='arbeit') entwurf.arbeit.push({bez:'',std:'',satz:daten.settings.stundensatz});
    else entwurf.teile.push({bez:'',menge:1,preis:''});
    zeichne();
  });
  i.querySelectorAll('[data-weg]').forEach(b=> b.onclick = ()=>{
    uebernehmen(); const [art,n] = b.dataset.weg.split(':'); entwurf[art].splice(+n,1); zeichne();
  });
  i.querySelectorAll('.pos .feld').forEach(f=> f.onchange = ()=>{ uebernehmen(); zeichne(); });
  [['fTermin','fUhrAnnahme'],['fFertig','fUhrFertig']].forEach(([dId,uId])=>{
    const d = document.getElementById(dId), u = document.getElementById(uId);
    if(!d || !u) return;
    const pruefen = ()=>{
      const leer = !d.value;
      if(leer) u.value = '';
      u.disabled = leer;
      u.placeholder = leer ? 'ohne Datum' : '';
    };
    d.onchange = ()=>{ pruefen(); if(!d.value) melden('Datum entfernt – der Kalendereintrag verschwindet beim Speichern.'); };
    pruefen();
  });
  bilderZeichnen();
  document.getElementById('btnBild').onclick = ()=> document.getElementById('bildWahl').click();
  document.getElementById('bildWahl').onchange = async e =>{
    const dateien = [...e.target.files];
    e.target.value = '';
    if(!dateien.length) return;
    uebernehmen();
    entwurf.bilder = entwurf.bilder || [];
    for(const d of dateien){
      try{
        melden('Lade ' + d.name + ' hoch …');
        entwurf.bilder.push(await bildHochladen(d, entwurf.nummer));
      }catch(err){ melden('Hochladen fehlgeschlagen: ' + err.message, true); }
    }
    zeichne();
    melden(dateien.length > 1 ? dateien.length + ' Bilder angehängt' : 'Bild angehängt');
  };
  document.getElementById('btnSchein').onclick = ()=> document.getElementById('scheinWahl').click();
  document.getElementById('scheinWahl').onchange = async e =>{
    const d = e.target.files[0];
    e.target.value = '';
    if(!d) return;
    uebernehmen();
    entwurf.bilder = entwurf.bilder || [];
    try{
      melden('Fahrzeugschein wird hochgeladen …');
      entwurf.bilder.push(await bildHochladen(d, entwurf.nummer));
      zeichne();
    }catch(err){ melden('Hochladen fehlgeschlagen: ' + err.message + ' – ich lese das Bild trotzdem aus.', true); }
    scheinLesen(d);
  };
  document.getElementById('btnSpeichern').onclick = speichernAuftrag;
  const d = document.getElementById('btnLoeschen');
  if(d) d.onclick = async ()=>{
    if(!confirm('Auftrag '+entwurf.nummer+' löschen? Vorhandene Kalendereinträge werden mitgelöscht.')) return;
    const weg = daten.auftraege.find(x=>x.id===aktuelleId);
    const nr = entwurf.nummer;
    daten.auftraege = daten.auftraege.filter(x=>x.id!==aktuelleId);
    zurueck(); render();
    let bilanz = {geloescht:0, offen:0};
    try{ zustand('laeuft','Kalender …'); bilanz = await kalenderEntfernen(weg); }catch(e){ bilanz.offen++; }
    await sichern();
    if(bilanz.offen) melden('Auftrag '+nr+' gelöscht, aber '+bilanz.offen+' Kalendereintrag/-einträge konnten nicht entfernt werden – bitte im Kalender prüfen.', true);
    else melden('Auftrag '+nr+' gelöscht'+(bilanz.geloescht?' samt '+bilanz.geloescht+(bilanz.geloescht>1?' Kalendereinträgen':' Kalendereintrag'):''));
  };
}
async function bilderZeichnen(){
  const streifen = document.getElementById('bildStreifen');
  if(!streifen || !entwurf) return;
  streifen.querySelectorAll('[data-bweg]').forEach(b => b.onclick = async ev =>{
    ev.stopPropagation();
    const i = +b.dataset.bweg, bild = entwurf.bilder[i];
    if(!confirm('Bild entfernen? Es wandert in den Drive-Papierkorb.')) return;
    uebernehmen();
    entwurf.bilder.splice(i,1);
    zeichne();
    await bildVerwerfen(bild);
  });
  for(const kachel of streifen.querySelectorAll('.bildkachel')){
    const b = entwurf.bilder[+kachel.dataset.b];
    if(!b) continue;
    try{
      const url = await bildUrl(b);
      const img = document.createElement('img');
      img.src = url; img.alt = b.name;
      kachel.querySelector('.lade')?.remove();
      kachel.insertBefore(img, kachel.firstChild);
      img.onclick = ()=> bildAnzeigen(url);
    }catch(e){
      const t = kachel.querySelector('.lade');
      if(t) t.textContent = 'nicht gefunden';
    }
  }
}

function uebernehmen(){
  const v = id => (document.getElementById(id)||{}).value || '';
  entwurf.termin = v('fTermin');
  entwurf.uhrAnnahme = entwurf.termin ? v('fUhrAnnahme') : '';
  entwurf.fertig = v('fFertig');
  entwurf.uhrFertig = entwurf.fertig ? v('fUhrFertig') : '';
  entwurf.kunde = {name:v('kName'), telefon:v('kTel'), email:v('kMail')};
  entwurf.fahrzeug = {marke:v('fMarke'), modell:v('fModell'), kennzeichen:v('fKennz').toUpperCase(),
                      fin:v('fFin').toUpperCase(), km:v('fKm')};
  entwurf.anliegen = v('fAnliegen'); entwurf.notiz = v('fNotiz');
  document.querySelectorAll('#blattInhalt .pos').forEach(p=>{
    const art = p.dataset.art, n = +p.dataset.i;
    p.querySelectorAll('.feld').forEach(f=> entwurf[art][n][f.dataset.f] = f.value);
  });
}
async function speichernAuftrag(){
  uebernehmen();
  entwurf.arbeit = entwurf.arbeit.filter(p=>p.bez||z(p.std));
  entwurf.teile = entwurf.teile.filter(p=>p.bez||z(p.preis));
  if(!entwurf.kunde.name && !entwurf.fahrzeug.kennzeichen && !entwurf.anliegen){
    melden('Mindestens Kunde, Kennzeichen oder Auftragsumfang ausfüllen.', true); return;
  }
  const i = daten.auftraege.findIndex(a=>a.id===entwurf.id);
  if(i>=0) daten.auftraege[i] = entwurf; else daten.auftraege.unshift(entwurf);
  const a = entwurf;
  zurueck(); render();
  let hinweis = '', bilanz = null;
  try{ zustand('laeuft','Kalender …'); bilanz = await kalenderAbgleich(a); }
  catch(e){ hinweis = e.message; }
  await sichern();
  if(hinweis) melden(hinweis + ' – Auftrag ist gespeichert, Termin nicht eingetragen.', true);
  else if(bilanz && bilanz.geloescht) melden('Gespeichert – ' + bilanz.geloescht + (bilanz.geloescht>1?' Kalendereinträge':' Kalendereintrag') + ' gelöscht');
}

/* ---------- Konto & Einrichtung ---------- */
function setup(){
  aktuelleId = null;
  document.getElementById('blattTitel').textContent = 'Konto & Datei';
  document.getElementById('blattInhalt').innerHTML = `
  <fieldset><legend>Google-Verbindung</legend>
    <p class="notiz">Die App liest und schreibt genau die JSON-Datei, die auch das Werkstatt-Tool am PC verwendet.
      Die Client-ID stammt aus Deinem Google-Cloud-Projekt (siehe Einrichtungsanleitung).</p>
    <label for="cId">OAuth Client-ID</label>
    <input class="feld" id="cId" placeholder="…apps.googleusercontent.com" value="${esc(cfg.clientId)}">
    <label for="cDatei">Dateiname in Drive</label>
    <input class="feld" id="cDatei" value="${esc(cfg.dateiName)}">
    <label for="cKonto">Google-Konto</label>
    <input class="feld" id="cKonto" type="email" placeholder="wird beim ersten Anmelden übernommen" value="${esc(cfg.konto)}">
    <p class="notiz">Steht hier eine Adresse, meldet sich die App direkt damit an – die Kontoauswahl entfällt. Zum Kontowechsel Feld leeren.</p>
    <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--tinte);margin:4px 0 12px">
      <input type="checkbox" id="cKal" ${cfg.kalender?'checked':''}> Termine im Google Kalender führen
    </label>
    <button class="k2" id="btnVerbinden" style="margin-top:4px">Mit Google verbinden</button>
  </fieldset>
  <fieldset><legend>Betrieb</legend>
    <p class="notiz">Erscheint auf dem Auftragszettel am Rechner. Wird zusammen mit den Aufträgen in Drive gespeichert.</p>
    <label for="cBetrieb">Betrieb, Anschrift, Kontakt</label>
    <textarea class="feld" id="cBetrieb" rows="4">${esc(daten.settings.betrieb || VORGABE.betrieb)}</textarea>
    <label for="cStd">Stundensatz (€)</label>
    <input class="feld" id="cStd" type="number" step="0.5" value="${esc(daten.settings.stundensatz)}">
    <label for="cUst">Umsatzsteuer</label>
    <select class="feld" id="cUst">
      <option value="0" ${!daten.settings.kleinunternehmer?'selected':''}>Regelbesteuerung – USt ausweisen</option>
      <option value="1" ${daten.settings.kleinunternehmer?'selected':''}>Kleinunternehmer § 19 UStG</option>
    </select>
    <button class="k2" id="btnBetriebSpeichern">Betriebsdaten speichern</button>
  </fieldset>
  <fieldset><legend>Status</legend>
    <p class="notiz">${dateiId ? 'Verbunden mit <code>'+esc(cfg.dateiName)+'</code>. Aufträge: '+daten.auftraege.length
      : 'Noch keine Datei verbunden.'}</p>
    <p class="notiz">${tokenGueltig()
      ? 'Angemeldet, gültig bis ' + new Date(tokenBis).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' Uhr. Danach meldet sich die App im Hintergrund selbst neu an.'
      : 'Zurzeit nicht angemeldet.'}</p>
    <button class="k2" id="btnNeuLaden">Vom Drive neu laden</button>
    <button class="k2" id="btnAbmelden" style="margin-top:8px">Abmelden</button>
  </fieldset>
  <div class="aktionen"><button class="k2 k2-haupt" id="btnFertig">Fertig</button></div>`;
  document.getElementById('cKal').onchange = e =>{ cfg.kalender = e.target.checked; lsSet('werkstatt-cfg', JSON.stringify(cfg)); };
  document.getElementById('btnVerbinden').onclick = async ()=>{
    cfg.clientId = document.getElementById('cId').value.trim();
    cfg.dateiName = document.getElementById('cDatei').value.trim() || 'werkstattauftraege-daten.json';
    cfg.konto = document.getElementById('cKonto').value.trim();
    lsSet('werkstatt-cfg', JSON.stringify(cfg));
    dateiId = null; tokenVerwerfen();
    try{ await anmelden(true); await holen(); zurueck(); melden('Verbunden'); }
    catch(e){ melden(e.message, true); }
  };
  document.getElementById('btnBetriebSpeichern').onclick = async ()=>{
    daten.settings.betrieb = document.getElementById('cBetrieb').value;
    daten.settings.stundensatz = parseFloat(String(document.getElementById('cStd').value).replace(',','.')) || VORGABE.stundensatz;
    daten.settings.kleinunternehmer = document.getElementById('cUst').value === '1';
    await sichern(); render();
  };
  document.getElementById('btnNeuLaden').onclick = async ()=>{ dateiId = null; await holen(); zurueck(); };
  document.getElementById('btnAbmelden').onclick = ()=>{
    tokenVerwerfen(); dateiId = null;
    zustand('aus','Abgemeldet');
    melden('Abgemeldet – Token entfernt, Konto bleibt für die nächste Anmeldung hinterlegt.'); setup();
  };
  document.getElementById('btnFertig').onclick = ()=>{
    cfg.clientId = document.getElementById('cId').value.trim();
    cfg.dateiName = document.getElementById('cDatei').value.trim() || cfg.dateiName;
    cfg.konto = document.getElementById('cKonto').value.trim();
    lsSet('werkstatt-cfg', JSON.stringify(cfg)); zurueck();
  };
  document.getElementById('blatt').hidden = false;
  document.body.style.overflow = 'hidden';
}

/* ---------- Start ---------- */
document.getElementById('btnNeu').onclick = ()=> editor(null);
document.getElementById('btnZurueck').onclick = zurueck;
document.getElementById('bildvollZu').onclick = ()=>{ document.getElementById('bildvoll').hidden = true; };
document.getElementById('bildvoll').onclick = e =>{ if(e.target.id === 'bildvoll') document.getElementById('bildvoll').hidden = true; };
document.getElementById('btnSetup').onclick = setup;
document.getElementById('btnSync').onclick = ()=> holen();
document.getElementById('btnJetzt').onclick = ()=> holen();
document.getElementById('suche').oninput = e =>{ suchtext = e.target.value; renderListe(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && dateiId && document.getElementById('blatt').hidden) holen(true); });

(function start(){
  try{ const c = JSON.parse(lsGet('werkstatt-cfg')||'null'); if(c) cfg = Object.assign(cfg,c); }catch(e){}
  try{ const c = JSON.parse(lsGet('werkstatt-cache')||'null'); if(c && c.auftraege){ daten = c; daten.settings = Object.assign({},VORGABE,c.settings||{}); } }catch(e){}
  render();
  if(!cfg.clientId){ zustand('aus','Einrichtung nötig – auf Konto tippen'); return; }
  if(tokenHolenAusSpeicher()){ zustand('laeuft','Angemeldet – lade …'); holen(true); return; }
  zustand('','Bereit');
  const warte = setInterval(()=>{ if(gisBereit()){ clearInterval(warte); holen(true); } }, 300);
  setTimeout(()=>clearInterval(warte), 15000);
})();
setInterval(()=>{
  if(document.hidden || !cfg.clientId || !gisBereit()) return;
  if(tokenBis && Date.now() > tokenBis - 10*60*1000) anmelden(false).catch(()=>{});
}, 4*60*1000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
